*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--f-ui);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
:focus-visible { outline: 2px solid var(--lee); outline-offset: 2px; }
#story h2[tabindex]:focus { outline: none; } /* the title takes focus by script so screen readers start there; it is not a control */
.ico { width: 1.05em; height: 1.05em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.16em; }
.eyebrow { font: 700 condensed .86rem/1.1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-dim); }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- shell ---------- */
.app { height: 100%; max-width: 1680px; margin: 0 auto; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
.deck {
  display: grid; gap: 12px; min-height: 0;
  grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.05fr) minmax(0, .9fr);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "map story side" "site story side";
}
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.mapbox { grid-area: map; position: relative; overflow: hidden; }
.sitebox { grid-area: site; position: relative; min-height: 0; overflow: auto; padding: 14px 16px 16px; }
.story { grid-area: story; position: relative; min-height: 0; overflow: auto; padding: 22px clamp(16px, 2vw, 28px) 26px; }
.sidebox { grid-area: side; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.tabpanel { position: relative; min-height: 0; overflow: auto; padding: 14px 16px 18px; }

/* ---------- header ---------- */
.top { position: relative; display: grid; gap: 10px; padding: 10px 16px 13px; }
.top::after { content: ""; position: absolute; inset: auto 0 0 0; height: 2px; border-radius: 0 0 6px 6px; background: linear-gradient(90deg, var(--glare), var(--rose) 48%, var(--lee)); }
.top-a { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; }
.top-b { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 30px; align-items: center; padding-top: 10px; border-top: 1px solid var(--line-soft); }
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand svg { width: 26px; height: 26px; flex: none; }
/* The logo is the theme switch. As a real button an iPhone tap counts as a click (WebKit ignores taps on a bare SVG)
   and the keyboard and VoiceOver reach it. The padding widens the target; the matching negative margin moves nothing. */
.brand-mark { appearance: none; -webkit-appearance: none; flex: none; display: grid; padding: 8px; margin: -8px; border: 0; border-radius: 6px; background: none; color: inherit; cursor: pointer; }
.bm-sun { fill: var(--glare); } .bm-line { stroke: var(--fg); stroke-width: 2; fill: none; stroke-linecap: round; } .bm-ref { stroke: var(--fg-faint); stroke-width: 1.6; fill: none; stroke-linecap: round; }
.brand h1 { font: 800 condensed 1.3rem/1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; }
.clock { font-size: .82rem; color: var(--fg-dim); }
.horizon { display: flex; align-items: center; gap: 10px; }
.horizon svg { width: 72px; height: 34px; flex: none; overflow: hidden; }
.hz-sun { fill: var(--glare); transition: transform 1.2s cubic-bezier(.3, .1, .2, 1); }
.hz-line { stroke: var(--fg); stroke-width: 1.5; } .hz-ref { stroke: var(--fg-faint); stroke-width: 1.2; stroke-linecap: round; }
.hz-text { font-size: .8rem; line-height: 1.25; color: var(--fg-dim); }
.hz-text b { display: block; color: var(--fg); font: 700 condensed 1.02rem/1.1 var(--f-display); letter-spacing: .07em; text-transform: uppercase; }
.gauges { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 26px; }
.gauge { min-width: 0; --m: var(--fg); display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "label label" "big side" "meter meter"; gap: 3px 10px; align-items: end; }
.gauge[data-state="warn"] { --m: var(--warn); } .gauge[data-state="crit"] { --m: var(--crit); }
.g-label { grid-area: label; display: flex; align-items: center; gap: .4rem; }
.g-warn { color: var(--m); }
.big { grid-area: big; font: 800 condensed 1.95rem/.92 var(--f-display); letter-spacing: .01em; }
.g-r { grid-area: side; min-width: 0; display: grid; gap: 1px; padding-bottom: 1px; font-size: .78rem; line-height: 1.3; color: var(--fg-dim); }
.g-delta { font-weight: 600; white-space: nowrap; }
.g-delta .arr { font-size: .7em; } .g-delta.up .arr { color: var(--ok); } .g-delta.down .arr { color: var(--crit); }
.gauge > .meter { grid-area: meter; margin-top: 3px; }
.meter { height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--m, var(--fg)) 22%, transparent); overflow: hidden; }
.meter > i { display: block; height: 100%; width: var(--w, 0%); background: var(--m, var(--fg)); border-radius: 2px; transition: width .6s; }
.aside { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
.substats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .82rem; color: var(--fg-dim); }
.substats > span { display: inline-flex; gap: .4rem; align-items: center; white-space: nowrap; }
.substats b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- buttons, chips ---------- */
.btn { appearance: none; border: 1px solid var(--line); background: var(--raised); color: var(--fg); padding: .55rem .95rem; border-radius: 4px; font-weight: 600; cursor: pointer; line-height: 1.2; }
.btn:hover:not(:disabled) { border-color: var(--fg-dim); }
.btn.primary { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); padding: .7rem 1.2rem; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.small { padding: .32rem .6rem; font-size: .82rem; font-weight: 500; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: .4rem; padding: .22rem .5rem; border: 1px solid var(--line); border-radius: 3px; white-space: nowrap; }
.kg { width: .78em; height: .78em; flex: none; fill: var(--k, var(--fg-dim)); }
.k-story { --k: var(--k-story); } .k-disaster { --k: var(--k-disaster); } .k-discovery { --k: var(--k-discovery); }
.k-consequence { --k: var(--k-consequence); } .k-politics { --k: var(--k-politics); } .k-order { --k: var(--k-order); }
.k-council { --k: var(--k-council); } .k-report { --k: var(--fg-faint); } .k-loss { --k: var(--crit); } .k-goal { --k: var(--fg-dim); }
.fx { display: inline-flex; align-items: center; gap: .3rem; font-size: .78rem; padding: .08rem .42rem; border: 1px solid var(--line); border-radius: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--fg); }
.fx .arr { font-size: .7em; } .fx.pos .arr { color: var(--ok); } .fx.neg .arr { color: var(--crit); } .fx.risk .arr { color: var(--warn); }
.fx.risk { white-space: normal; } /* a risk or a lock reason is a sentence: on a phone it has to wrap, or it widens the page */
.sigil { display: inline-grid; place-items: center; width: 2.25rem; height: 2.25rem; flex: none; border-radius: 4px; background: var(--c, var(--fg-faint)); color: var(--oc, #fff); font: 700 condensed 1rem/1 var(--f-display); letter-spacing: .04em; }
.sigil.sm { width: 1.35rem; height: 1.35rem; font-size: .68rem; border-radius: 3px; }
.c-kovac { --c: var(--k-story); --oc: var(--on-story); } .c-reyes { --c: var(--k-disaster); --oc: var(--on-disaster); } .c-hadley { --c: var(--k-discovery); --oc: var(--on-discovery); } .c-bao { --c: var(--k-consequence); --oc: var(--on-consequence); }
.c-moreau { --c: var(--k-politics); --oc: var(--on-politics); } .c-adeyemi { --c: var(--k-order); --oc: var(--on-order); } .c-patience { --c: var(--k-council); --oc: var(--on-council); }
.pill { display: inline-flex; align-items: center; gap: .3rem; font-size: .74rem; font-weight: 600; padding: .1rem .45rem; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; color: var(--fg); }
.pill .dot { width: .5em; height: .5em; border-radius: 50%; background: var(--fg-faint); }
.pill.loyal .dot, .pill.kept .dot { background: var(--ok); } .pill.hostile .dot, .pill.broken .dot { background: var(--crit); } .pill.opposed .dot { background: var(--warn); }

/* ---------- map ---------- */
.mapscroll { overflow-x: auto; }
#map { display: block; width: 100%; height: auto; aspect-ratio: 5 / 3; }
.st-a { stop-color: var(--map-a); } .st-b { stop-color: var(--map-b); } .st-c { stop-color: var(--map-c); } .st-d { stop-color: var(--map-d); }
.st-n0 { stop-color: var(--map-night); stop-opacity: 0; } .st-n1 { stop-color: var(--map-night); stop-opacity: .82; }
.contour { fill: none; stroke: var(--map-line); stroke-width: 1; }
.ridge { fill: none; stroke: var(--map-line); stroke-width: 44; stroke-linecap: round; opacity: .5; }
.scar { fill: var(--map-scar); } .frost { fill: var(--map-frost); } .shimmer { stroke: var(--map-line); stroke-width: 1.4; stroke-linecap: round; }
.route { fill: none; stroke: var(--map-path); stroke-width: 1.3; stroke-dasharray: 1.5 5; stroke-linecap: round; }
#night { transition: transform 1.6s cubic-bezier(.3, .1, .2, 1); }
.term-line { stroke: var(--fg); stroke-width: 1; stroke-dasharray: 1 6; stroke-linecap: round; opacity: .75; }
.map-text { font: 700 condensed 12px var(--f-display); font-size: calc(12px * var(--k, 1)); letter-spacing: .14em; fill: var(--fg); paint-order: stroke; stroke: var(--map-halo); stroke-width: 3.5px; stroke-linejoin: round; }
.map-text.dim { fill: var(--fg-dim); font-weight: 600; font-size: calc(11px * var(--k, 1)); }
.site { cursor: pointer; outline: none; }
.site-hit { fill: transparent; }
.site-disc { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; transition: fill .15s, stroke .15s; }
.site:hover .site-disc, .site:focus-visible .site-disc { fill: var(--raised); stroke: var(--fg); }
.site-ico { color: var(--fg); fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.site-track { fill: none; stroke: var(--map-halo); stroke-width: 5; opacity: .9; }
.site-ring { fill: none; stroke: var(--fg); stroke-width: 3; transition: stroke-dasharray .6s; }
.site[data-state="warn"] .site-ring { stroke: var(--warn); } .site[data-state="crit"] .site-ring { stroke: var(--crit); }
.site-name { font: 800 condensed 14.5px var(--f-display); font-size: calc(14.5px * var(--k, 1)); letter-spacing: .09em; text-anchor: middle; fill: var(--fg); paint-order: stroke; stroke: var(--map-halo); stroke-width: 4px; stroke-linejoin: round; }
.site-sub { font: 600 11.5px var(--f-ui); font-size: calc(11.5px * var(--k, 1)); letter-spacing: .04em; text-anchor: middle; fill: var(--fg-dim); paint-order: stroke; stroke: var(--map-halo); stroke-width: 3.5px; stroke-linejoin: round; }
.site-sel { fill: none; stroke: var(--fg); stroke-width: 1.5; stroke-dasharray: 3 4; opacity: 0; }
.site.sel .site-sel { opacity: 1; }
.site-pulse { fill: none; stroke: var(--glare); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
.site.hot .site-pulse { animation: pulse 1.9s ease-out infinite; }
@keyframes pulse { 0% { opacity: .95; transform: scale(.75); } 100% { opacity: 0; transform: scale(1.75); } }
.site-flag { fill: var(--crit); stroke: var(--surface); stroke-width: 2; }
.tok { cursor: pointer; outline: none; }
.tok-hit { fill: transparent; }
.hard { margin-top: 14px; } .hard .seg { margin-top: 6px; } .hard p { margin: 8px 0 0; font-size: .92rem; color: var(--fg-dim); } .hard p b { color: var(--fg); }
.tok:focus-visible circle { stroke: var(--fg); stroke-width: 2.5; }
.tok circle { fill: var(--c); stroke: var(--surface); stroke-width: 2; }
.tok text { font: 700 condensed 9.5px var(--f-display); font-size: calc(9.5px * var(--g, 1)); fill: var(--oc, #fff); text-anchor: middle; letter-spacing: .03em; pointer-events: none; }

/* ---------- site panel ---------- */
.site-head { display: flex; gap: 12px; align-items: center; }
.site-head .badge { display: grid; place-items: center; width: 2.6rem; height: 2.6rem; border: 1px solid var(--line); border-radius: 50%; flex: none; }
.site-head .badge .ico { width: 1.35rem; height: 1.35rem; }
.site-head h3 { font: 800 condensed 1.4rem/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.site-head .st { font-size: .82rem; color: var(--fg-dim); margin-top: 3px; }
.blurb { color: var(--fg-dim); margin-top: 10px; max-width: 62ch; }
.integ { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; margin-top: 12px; font-size: .82rem; color: var(--fg-dim); --m: var(--fg); }
.integ[data-state="warn"] { --m: var(--warn); } .integ[data-state="crit"] { --m: var(--crit); }
.integ b { color: var(--fg); font-variant-numeric: tabular-nums; }
.present { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 12px; font-size: .82rem; color: var(--fg-dim); align-items: center; }
.present > span { display: inline-flex; gap: .4rem; align-items: center; }
.orders-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 16px 0 8px; flex-wrap: wrap; }
.orders-head .crew { font-size: .82rem; color: var(--fg-dim); }
.orders { display: grid; gap: 8px; }
.order { width: 100%; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 9px 12px; background: var(--raised); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
.order:hover:not(:disabled) { border-color: var(--fg-dim); }
.order:disabled { cursor: not-allowed; }
.order:disabled .o-label, .order:disabled .o-desc, .order:disabled .o-cost { opacity: .55; }
.o-label { font-weight: 600; } .o-desc { grid-column: 1; font-size: .84rem; color: var(--fg-dim); }
.o-cost { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.o-why { grid-column: 1 / -1; font-size: .8rem; color: var(--fg-dim); display: flex; gap: .35rem; align-items: center; }
.done-note { margin-top: 10px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 4px; font-size: .86rem; color: var(--fg-dim); }
.site-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: 6px; margin-top: 14px; }
.site-list button { text-align: left; }

/* ---------- story ---------- */
.ev-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 14px; }
.ev-head .where { font-size: .84rem; color: var(--fg-dim); }
.ev-head .when { margin-left: auto; font-size: .84rem; color: var(--fg-dim); white-space: nowrap; }
.story h2 { font: 800 condensed clamp(1.8rem, 2.5vw, 2.4rem)/1 var(--f-display); letter-spacing: .015em; text-transform: uppercase; margin-bottom: 12px; text-wrap: balance; }
.origin { display: flex; gap: .5rem; align-items: baseline; margin: -2px 0 12px; font-size: .86rem; color: var(--fg-dim); }
.speaker { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.speaker .who { font-weight: 600; line-height: 1.2; } .speaker .role { color: var(--fg-dim); font-size: .82rem; }
.prose { font: 400 1.06rem/1.62 var(--f-prose); max-width: 64ch; }
.prose p + p { margin-top: .85em; }
.choices { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 8px; }
.choice { width: 100%; text-align: left; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 11px 13px 12px; background: var(--raised); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
.choice:hover:not(:disabled) { border-color: var(--fg); }
.choice:disabled { cursor: not-allowed; }
.choice:disabled .c-label, .choice:disabled .c-note, .choice:disabled .c-logic { opacity: .55; }
.c-key { font: 800 condensed 1.25rem/1.15 var(--f-display); color: var(--fg-faint); min-width: .9em; }
.c-label { display: block; font-weight: 600; font-size: 1rem; line-height: 1.35; }
.c-note { display: block; color: var(--fg-dim); font-size: .86rem; margin-top: 2px; }
.c-logic { display: flex; gap: .4rem; align-items: baseline; color: var(--fg-dim); font-size: .84rem; line-height: 1.4; margin-top: 6px; }
.c-logic .ico { color: var(--warn); }
.c-meta { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 8px; align-items: center; }
.stance { position: relative; display: inline-flex; align-items: center; gap: 4px; font-size: .76rem; color: var(--fg-dim); margin-right: 6px; }
.c-why { display: grid; gap: 2px; margin-top: 8px; font-size: .82rem; color: var(--fg-dim); }
.c-why > span { display: flex; gap: .4rem; align-items: baseline; } .c-why b { color: var(--fg); font-weight: 600; }
.arr.up { color: var(--ok); } .arr.down { color: var(--crit); }
.opt { display: flex; align-items: center; gap: .5rem; margin-top: 14px; font-size: .84rem; color: var(--fg-dim); cursor: pointer; width: fit-content; }
.decided { font-size: .9rem; color: var(--fg-dim); margin-bottom: 12px; } .decided b { color: var(--fg); font-weight: 600; }
.fxlist { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 16px 0 0; }
.reactions { list-style: none; margin: 18px 0 0; padding: 14px 0 0; border-top: 1px solid var(--line-soft); display: grid; gap: 12px; }
.reactions li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; }
.reactions .sigil { grid-row: 1 / span 2; }
.r-top { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; font-size: .9rem; } .r-top b { font-weight: 600; }
.r-top .d { font-size: .8rem; color: var(--fg-dim); white-space: nowrap; }
.reactions q { grid-column: 2; font: italic 400 1rem/1.45 var(--f-prose); quotes: none; }
.r-rest { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 12px; font-size: .82rem; color: var(--fg-dim); }
.r-rest > span { display: inline-flex; gap: .35rem; align-items: center; }
.motion { margin-top: 14px; font-size: .86rem; color: var(--fg-dim); display: flex; gap: .5rem; align-items: baseline; }
.actions { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 22px; }
.actions .hint { font-size: .84rem; color: var(--fg-dim); }
.rep { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; max-width: 64ch; }
.rep li { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr); gap: 8px; font: 400 1rem/1.5 var(--f-prose); }
.rep .mk { font: 700 1rem/1.5 var(--f-ui); text-align: center; color: var(--fg-faint); }
.rep .good .mk { color: var(--ok); } .rep .bad .mk, .rep .loss .mk { color: var(--crit); }
.rep .src { display: block; font: 400 .8rem/1.3 var(--f-ui); color: var(--fg-dim); margin-top: 2px; }
.minis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line-soft); }
.minis div { min-width: 0; } .minis b { display: block; font: 800 condensed 1.35rem/1.1 var(--f-display); } .minis small { font-size: .78rem; color: var(--fg-dim); }
.watch { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 6px; }
.watch button { width: 100%; text-align: left; display: flex; gap: .55rem; align-items: baseline; padding: 7px 10px; background: transparent; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; font-size: .9rem; }
.watch button:hover { border-color: var(--fg-dim); }
.watch .mk { color: var(--warn); font-size: .75em; } .watch .crit .mk { color: var(--crit); }
.lede { font: 400 1.12rem/1.6 var(--f-prose); max-width: 58ch; }
.title-card h2 { font-size: clamp(2.5rem, 4.4vw, 3.8rem); line-height: .93; margin-bottom: 16px; }
.field { display: grid; gap: 6px; margin-top: 20px; max-width: 20rem; }
.field input { padding: .6rem .7rem; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); width: 100%; }
.howto { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 8px; color: var(--fg-dim); font-size: .93rem; max-width: 60ch; }
.howto li { display: grid; grid-template-columns: 1.3rem minmax(0, 1fr); gap: 8px; } .howto .ico { margin-top: .2em; color: var(--fg); }
.found { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line-soft); font-size: .86rem; color: var(--fg-dim); }
.end-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.end-grid span { padding: .16rem .5rem; border: 1px solid var(--line-soft); border-radius: 3px; color: var(--fg-faint); }
.xfer { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line-soft); font-size: .86rem; color: var(--fg-dim); }
.xfer p { margin: 4px 0 0; max-width: 60ch; }
.xfer textarea { display: block; width: 100%; max-width: 36rem; min-height: 4.8em; margin-top: 8px; padding: .5rem .6rem; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); font: .78rem/1.35 ui-monospace, Consolas, monospace; word-break: break-all; resize: vertical; }
.xfer .actions { margin-top: 10px; }
.inh > p { margin: 0; max-width: 62ch; font-size: .92rem; color: var(--fg-dim); }
details.inh-t { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line-soft); font-size: .86rem; color: var(--fg-dim); }
details.inh-t summary { cursor: pointer; width: fit-content; max-width: 100%; }
details.inh-t summary .eyebrow { margin-right: .5rem; }
details.inh-t > p { margin: 8px 0 0; max-width: 60ch; }
.inh-bank { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 12px; }
.inh-bank .eyebrow { margin-right: 2px; }
.inh-msg { margin: 8px 0 0; font-size: .84rem; color: var(--fg); outline: none; }
.perks { list-style: none; padding: 0; margin: 10px 0 0; max-width: 42rem; }
.perk { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line-soft); }
.pk-t { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: .92rem; color: var(--fg); }
.pk-d { grid-column: 1; margin: 0; font-size: .84rem; line-height: 1.4; color: var(--fg-dim); }
.pk-d .pk-now { display: block; color: var(--fg-faint); }
.pk-buy { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--fg-dim); }
.pips i.on { background: var(--fg); border-color: var(--fg); }
@media (max-width: 519px) {
  .perk { grid-template-columns: minmax(0, 1fr); }
  .pk-buy { grid-column: 1; grid-row: auto; justify-content: flex-start; margin-top: 4px; }
}
.end-grid .got { color: var(--fg); border-color: var(--fg-dim); }
.ending h3, .sec { font: 700 condensed 1rem/1.1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-dim); margin: 24px 0 10px; }
.tally { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.6rem, 1fr)); gap: 10px 14px; }
.tally div { border-top: 1px solid var(--line); padding-top: 8px; }
.tally b { display: block; font: 800 condensed 1.7rem/1 var(--f-display); } .tally small { font-size: .78rem; color: var(--fg-dim); }
.epi { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; max-width: 64ch; }

'use strict';
/* The Halflight Mandate: core simulation.
   State (S) is plain JSON so it can be saved. Content lives in EVENTS, CHARS, ORDERS, GOALS, ENDINGS. */
const VERSION = 1, SAVE_KEY = 'halflight.save.v1', META_KEY = 'halflight.meta.v1';
/* A term is TERM_LEN spans. The calendar was written for 20, so every span named in a rule or a line of text is a span
   of that plan, placed in the running term by sp(); was(t) is the span of the plan that span t plays as. Saves from
   before the longer term carry no len and keep 20 spans: setTerm() points LAST_SPAN and the Dimming at whichever term
   S is, so it runs whenever S changes. */
const TERM_LEN = 40, START_DAY = 431, COHORT = 24, SPAN_MIN = 3, FOOD_KEEP = 200;
const spoilage = food => food > FOOD_KEEP ? Math.round((food - FOOD_KEEP) * 0.2) : 0;   /* the stores keep 200; a fifth of anything over spoils each span */
let LAST_SPAN = TERM_LEN, DIM_START = 0, DIM_END = TERM_LEN;   /* set by setTerm() just below */
const RACK = [0, 14, 26, 37, 47, 56], HEARTH = [0, 30, 44, 58], MIRROR = [0, 14, 22, 30];
const RATION = { lean: 0.75, tiered: 0.87, standard: 1, generous: 1.2 };
const RES = ['food', 'energy', 'morale', 'pop', 'sleepers', 'parts', 'dead'];
const EVENTS = {}, HANDLERS = {}, GOALS = {}, ORDERS = {}, ENDINGS = {};
let S = null;

/* ---------- helpers ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rnd() {
  S.rng = (S.rng + 0x6D2B79F5) | 0;
  let t = S.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

const rint = (a, b) => a + Math.floor(rnd() * (b - a + 1));
/* A fixed draw from the seed and a key. It never touches S.rng, so reading it (in a label, say) changes nothing else. */

function begin(name, seed, perks, hard) {
  S = newState(name, seed == null ? (Date.now() ^ (Math.random() * 0x7fffffff)) | 0 : seed);
  setTerm(S);
  const m = loadMeta();
  S.hard = hard != null ? clamp(Math.floor(hard) || 0, 0, HARD.length) : hardPick(m);
  harden(S);
  if (S.hard) log('story', 'A harder mandate', `This term is played at hardship ${ROMAN[S.hard]}. ${HARD.slice(0, S.hard).map(h => h.say).join(' ')}`);
  const s0 = snap(), got = inherit(S, perks || m.perks);

  S.queue = ['i_wake', 'i_brief', 'i_keel', 'i_address'].map(id => ({ id }));
  nextUp();
  return S;
}

Object.assign(HANDLERS, {
  councilOnKovac: () => {
    infl('kovac', -6); gain('morale', 2); trust('kovac', 3, 'let the council confirm him as Captain of the Watch');

  hearthRebuilt: () => {
    fix('hearth', 34);
    return { k: 'good', who: 'reyes', text: `Loop Two is rebuilt and the Hearth is back at full output, ${S.sites.hearth.integ}% sound. Reyes left a note on your desk that reads, in full, “Done right.”` };
  },
  scramCheck: () => {
    if (chance(0.45)) return { ev: 'scram' };
    fix('hearth', 8);
    return { k: 'good', who: 'reyes', text: 'The hot patch on Loop Two has held. Reyes will not say he was wrong, only that it should not have.' };
  },
  cohortSkills: () => {
    const ids = shuffled(['racks', 'hearth', 'ice', 'mirror']).slice(0, 2);
    ids.forEach(id => fix(id, 10));
    return { k: 'good', text: `The cohort you woke has found its feet: two welders, a hydrologist and a children’s nurse among them. They have been patching ${SITES[ids[0]].name} and ${SITES[ids[1]].name} on their own time.` };
  },
  revealHollows: () => {
    S.sites.hollows.known = true;
    later(1, { ev: 'hollows_report', label: 'Hadley’s report on the Hollows' });
    return { k: 'good', who: 'hadley', text: 'Hadley’s survey is back. The Hollows are real and they are on the map: three kilometres of lava tube, fourteen degrees, bone dry.' };
  },
  revealFlats: () => {
    S.sites.flats.known = true;
    later(1, { ev: 'dusk_trial', label: 'Dr. Adeyemi’s findings on duskbloom' });
    return { k: 'good', who: 'adeyemi', text: 'Dr. Adeyemi’s team has mapped the lichen mats leeward of the Ice Works. They are calling the place Duskbloom Flats.' };
  },
  windowCloses: () => {
    if (S.seen.hail_window || S.flags.spire === 'refused' || S.sites.ridge.stage >= 3) return null;
    const c = S.flags.spire === 'committed';
    gain('morale', c ? -6 : -2);
    trust('reyes', -8, 'let the hail window close with the Spire unfinished');
    return { k: 'bad', who: 'reyes', text: 'The Slow Mercy has passed out of the beam. The Spire stands unfinished on Signal Ridge, and it will never hail anyone now.' + (c ? ' The colony was promised a signal.' : '') };
  }
});

<script>

Object.assign(EVENTS, {
  tally_short: {

  curfew: {
    kind: 'politics', title: 'After Third Bell', site: 'keel', who: 'kovac',
    enter: () => { npc('eye', 'a lamp fitter'); },
    text: () => {
      const p = npc('eye', 'a lamp fitter');

        `It starts in the ration queue and ends in the infirmary. Nobody agrees on who threw the first punch. Everyone agrees that ${p.name}, ${p.role}, has lost the sight of one eye, and that the man who did it was hungry and frightened and is now sitting in the Watch room with his head in his hands.`,
        `Kovač has the order drafted already. Curfew after third bell. Watch patrols in the dormitory ring, in pairs, with batons. “Not forever. Until the temperature comes down.”`,
        `“The temperature,” Moreau says, “is people. Let the Commons name its own stewards. People who live in those dormitories. They’ll be listened to in a way a baton never is.”`
      ];
    },
    choices: [
      {
        label: 'Sign the curfew. Patrols start tonight.', fx: { morale: -4 }, tags: { decree: 2, watch: 2 }, infl: { kovac: 8 }, log: 'signed the curfew',
        run: () => { flag('curfew', 'on'); later(rint(2, 3), { ev: 'baton', hidden: true, label: 'The curfew' }); },

        out: `Moreau has twenty names by the end of the shift: a grandmother from the east dormitory, two ice cutters, a boy of sixteen whom everyone inexplicably listens to. They wear a strip of yellow hull tape on one arm. The Watch regards them the way a cat regards a second cat.`

  baton: {

    kind: 'politics', title: 'The Count', site: 'keel', who: 'moreau', gate: s => s.flags.election === 'called',
    enter: s => {
      const sup = Math.round(s.morale * 0.45 + avgTrust() * 0.45 + s.axes.candor * 1.2 + s.axes.rule * 0.8 + 6 + rint(-4, 4));
      s.scene.pct = clamp(sup, 22, 81); s.scene.won = s.scene.pct >= 50;
    },
    text: s => [
      `They count in the open, at the Plate, with a teller from every dormitory. It takes most of a shift. Twelve seats on the assembly. And at the top of the slate, the question nobody was sure you would allow: *Shall the charter governor continue in office?*`,
      s.scene.won ? `${s.scene.pct} percent say yes.` : `${s.scene.pct} percent say yes. It is not enough.`,
      s.scene.won
        ? `Moreau reads the figure out herself. She does not look surprised, exactly. She looks like someone revising an opinion in public and deciding to do it gracefully. “Governor,” she says. “The assembly is seated. It would like to know how you intend to work with it.”`
        : `The room is very quiet. Moreau reads the figure out without triumph. “The assembly thanks the Governor for calling this vote. It took courage. The assembly asks the Governor to honor it.” Kovač, at the back, has unfolded his arms. He is watching you the way he watched you take the key.`
    ],
    choices: [
      {
        when: s => s.scene.won, label: 'Serve as its executive. The assembly holds the purse.', fx: { morale: 6 }, tags: { consent: 2 }, log: 'won the vote and handed the assembly the purse',
        run: () => { flag('assembly'); flag('election', 'held'); },
        out: `You hand the ration ledger across the table. It is a small book. The room watches it change hands as if it were a crown. From now on the hard numbers will be argued in the open before you act on them. It will be slower, and it will be theirs.`
      },
      {
        when: s => s.scene.won, label: 'Chair it yourself. The charter office stays whole.', fx: { morale: 3 }, tags: { decree: 1 }, trust: { moreau: -3 }, log: 'won the vote and took the assembly’s chair yourself',
        run: () => { flag('assembly'); flag('election', 'held'); },
        out: `You take the chair at the head of the table, and nobody objects out loud. The assembly will advise. You will decide. Moreau notes, for the minutes, that the minutes will be public.`
      },
      {
        when: s => !s.scene.won, label: 'Concede. Hand over the key.', tags: { consent: 3 }, log: 'lost the vote and conceded',
        run: () => { flag('election', 'held'); S.ending = 'transfer'; },
        out: `You take the lanyard from around your neck. The brass key is warm. You put it in Moreau’s hand and close her fingers over it, and the sound the Commons makes is not a cheer. It is quieter than that, and it lasts longer.`
      },
      {
        when: s => !s.scene.won, label: '“The charter outranks a show of hands.”', fx: { morale: -14 }, tags: { decree: 4 }, infl: { moreau: 8, kovac: 6 }, log: 'voided the election you lost',
        run: () => { flag('usurper'); flag('election', 'voided'); trust('moreau', -16, 'voided the election you lost'); },
        out: `You say it, and you watch three hundred people understand what you have said. The Watch moves to the doors. Nobody resists. They simply leave, all of them, in silence, until you are standing alone at the Plate with thirty-eight names and a brass key.`
      },
      {
        when: s => s.scene.won, label: 'Ask the assembly to set your term: first light, then a fresh count.', note: 'You make yourself temporary, in public.',
        fx: { morale: 5 }, tags: { consent: 3 }, log: 'won the vote and asked the assembly to limit your term',
        run: () => { flag('assembly'); flag('election', 'held'); },
        out: `“A term,” Moreau repeats, with something like delight. The assembly debates the length for two hours and settles on yours: first light, plus one span, then a fresh count. You have just made yourself temporary, in front of everyone, and the room knows exactly what that cost.`
      },
      {
        when: s => s.scene.won, label: 'Put the Watch under the assembly too.', note: 'Kovač answers to twelve people now.',
        fx: { morale: 5 }, tags: { consent: 2, commons: 1 }, trust: { kovac: -5 }, log: 'won the vote and put the Watch under the assembly',
        run: () => { flag('assembly'); flag('election', 'held'); },
        out: `Kovač hears it at the back of the room, and you watch him decide, in real time, whether to object. He doesn’t. “The Watch will answer to the assembly,” he says. “It will be slower.” He is right, and it is.`
      },
      {
        when: s => !s.scene.won, label: 'Offer to serve as the assembly’s executive until first light.', note: 'Their decision now.', logic: s => `Works if ${atLeast('council trust', avgTrust(s), 50)}, or ${atLeast('Moreau’s trust', s.chars.moreau.trust, 55)}: you serve the assembly until first light. Otherwise they vote you out, and your term ends here.`,
        tags: { consent: 2 }, log: 'lost the vote and offered to serve the assembly until first light',
        run: s => { s.tmp.ok = avgTrust() >= 50 || s.chars.moreau.trust >= 55; flag('election', 'held'); if (s.tmp.ok) flag('assembly'); else S.ending = 'transfer'; },
        out: s => s.tmp.ok
          ? `The assembly argues about it for most of a shift, which you sit through in the back row like anyone else. Then it votes: yes, until first light, and not one span after. Moreau brings the key back to you herself. “Borrowed,” she says.`
          : `The assembly hears you out politely and votes no, without much argument. Moreau says it is nothing personal, and you can see that she means it, which is worse. You take off the lanyard and lay the key on the table.`
      },
      {
        when: s => !s.scene.won, label: '“Not in the dark. We count again at first light.”', note: 'You keep the key. Few will thank you.', risk: 'The Commons will remember',
        fx: { morale: -8 }, tags: { decree: 2 }, trust: { moreau: -10 }, infl: { moreau: 5 }, log: 'set aside the vote you lost until first light',
        run: () => flag('election', 'promised'),
        out: `“At first light,” you say, “with the sun up and the stores counted.” It is not a coup, quite, and that is how the Watch takes it: nobody moves. Moreau does not argue. She chalks the date on the Plate, under the last name, where everyone will have to walk past it.`
      }
    ]
  },

  dusk_trial: {
    kind: 'discovery', title: 'Duskbloom', site: 'flats', who: 'adeyemi',
    text: () => [
      `Dr. Adeyemi has not been this happy since landfall, and she is trying hard to be a scientist about it.`,
      `“It’s edible. More than edible. Complete protein, most of the vitamins we’ve been rationing out of ship’s stock, and it grows on warm rock in the dark with a trickle of water. No lamps. Governor, *no lamps.*”`,
      `She stops, and the scientist wins. “And it colonizes the gut. For good, as far as I can tell. The mice are healthy. Better than healthy. But their eyes have changed, a silvering behind the retina, and they see in the dark now. I don’t know what else it changes. I know it does not come back out. If we eat this, we stop being people who are visiting.”`
    ],
    choices: [
      {
        label: 'Approve it. Anyone who chooses may eat.', note: 'Unlocks duskbloom beds at the Flats.',
        tags: { roots: 2, consent: 1, growers: 1 }, log: 'approved duskbloom for anyone who chose it',
        run: () => flag('dusk', 'approved'),
        out: `Dr. Adeyemi eats the first portion herself, in the Commons, at the long table, with half the colony watching. “Tastes like mushrooms that went to university,” she announces. About a third of the room lines up behind her. The rest watch their neighbors’ eyes for a long time afterward.`
      },
      {
        label: 'Put it in the ration. Everyone eats.', note: 'Unlocks the beds, and the wild mats add 5 food a span at once.',
        fx: { morale: -3 }, tags: { roots: 3, decree: 1 }, trust: { moreau: -4 }, log: 'put duskbloom in everyone’s ration',
        run: () => { flag('dusk', 'mandated'); mod({ id: 'wildmats', label: 'Wild duskbloom in the ration', k: 'food', add: 5 }); },
        out: `It goes into the common pot the next span, a grey-violet fleck in the stew. Some people pick it out. Some stop eating in the mess hall. Within three spans the first silver-eyed children are running the corridors after lights-out and not bumping into anything.`
      },
      {
        label: 'Forbid it. “We stay what we are.”', tags: { return: 1 }, trust: { adeyemi: -8, hadley: -3, reyes: 2 }, log: 'forbade the eating of duskbloom',
        run: () => flag('dusk', 'forbidden'),
        out: `Dr. Adeyemi closes her notebook. “The mice,” she says carefully, “are going to outlive us.” She seals the samples and logs them, because she is a scientist. She does not destroy the cultures. You do not ask her to.`
      },
      {
        label: 'Volunteers only, for two spans. Then decide.', note: 'Slower. The beds unlock when the trial ends.',
        tags: { roots: 1, candor: 1 }, trust: { adeyemi: 2 }, log: 'ran a volunteer trial of duskbloom',
        run: () => { flag('dusk', 'trial'); later(2, { h: 'duskTrialDone', label: 'The duskbloom volunteers' }); },
        out: `Twelve volunteers. Dr. Adeyemi’s is the first name on the list, and she has written it in ink. They eat at a separate table and are examined every shift. The whole colony finds reasons to walk past.`
      }
    ]
  },

  hollows_report: {
    kind: 'discovery', title: 'Fourteen Degrees', site: 'hollows', who: 'hadley', gate: s => !s.flags.hollows,
    text: () => [
      `Hadley unrolls the full survey across your desk and weights the corners with ration tins. Three kilometres of lava tube in four galleries. A lake fed by a warm vent. Fourteen degrees at the back wall, and it has been fourteen degrees there for ten thousand years.`,
      `“No wind. No frost. No glarestorm ever reaches it. Forty kilometres over the shelf, and I can mark a road.” He taps the largest gallery. “The Hearth can’t move, so it would be vent taps for power. Less than we have here. But less to heat.”`,
      `He looks up. It is the longest speech you have heard him make. “The ridge is where the ship fell. Nobody chose it. I’m asking you to choose.”`
    ],
    choices: [
      {
        label: 'Fit it out as a refuge for the dark.', note: 'Unlocks work on the Hollows.',
        tags: { outriders: 1, roots: 1 }, trust: { hadley: 2 }, log: 'chose to fit out the Hollows as a refuge',
        run: () => flag('hollows', 'refuge'),
        out: `“A refuge,” Hadley says, turning the word over. “It’s a start.” He has the road staked within the span: a line of salvaged hull lamps running out across the shelf, leeward, into a dark that has never had a light in it before.`
      },
      {
        label: 'Send a founding party now. Thirty-six, to live there.', note: 'They leave the ridge for good and build the first stage themselves.',
        fx: { pop: -36 }, tags: { outriders: 2, roots: 2 }, trust: { kovac: -4 }, log: 'sent a founding party to settle the Hollows',
        run: s => { flag('hollows', 'settled'); flag('two_fires'); s.sites.hollows.stage = Math.max(1, s.sites.hollows.stage); s.hollowsPop = 36; s.flags.hope = s.turn; },
        out: `Thirty-six volunteers, six sledges, and Hadley out in front on foot. The whole Keel turns out to watch the lamps dwindle down the shelf. Halflight has thirty-six fewer mouths tonight, and for the first time since landfall there are people on Hesper who cannot see the wreck.`
      },
      {
        label: '“The ridge is home. We hold it.”', trust: { hadley: -8 }, log: 'declined to develop the Hollows',
        run: () => { flag('hollows', 'declined'); const g = S.goals.find(x => x.id === 'h2_hollows' && x.state === 'open'); if (g) g.id = 'h2_winter'; },
        out: `Hadley rolls the survey up slowly. “The ridge will have an opinion about that,” he says. He leaves the ration tins where they are. Over the next span you notice that the outriders have stopped coming into the Commons.`
      },
      {
        label: 'Cache food along the road, and keep the Hollows as a last resort.', note: 'Costs 10 food. Work on the Hollows unlocks.',
        fx: { food: -10 }, tags: { outriders: 1, arithmetic: 1 }, trust: { hadley: 2, kovac: 1 }, log: 'cached food along the road to the Hollows',
        run: () => flag('hollows', 'refuge'),
        out: `Hadley’s outriders lay three caches along the road, a sealed drum of rations under a marker pole at each. “A road you might use,” Hadley says, “is still a road.” Kovač, reading the plan, adds a fourth himself, nearer the Keel, and initials it.`
      }
    ]
  },

  hail_window: {
    kind: 'story', title: 'The Beam', site: 'ridge', who: 'reyes',
    text: s => [
      `The Spire stands sixty metres over Signal Ridge, and the whole colony has walked up to stand beneath it. The *Slow Mercy* is in the beam. Reyes has the power routed and his hand over the key. There is charge for one burst, long enough for a few sentences, and no way to take them back.`,
      `“Twenty-six months out,” he says. “If she diverts she’s here in about nine hundred days. Six hundred colonists and a working drive.” He looks at you. He has waited ${Math.max(1, s.turn - sp(6))} spans to ask this. “What do we say?”`
    ],
    choices: [
      {
        label: '“Come and take us off this world.”', note: 'The burst drains 12 reserve power.', tags: { return: 3 }, log: 'hailed the Slow Mercy and asked for rescue',
        run: () => { gain('energy', -12); flag('mercy', 'come_get'); flag('hailed'); later(2, { ev: 'mercy_reply', label: 'A reply from the Slow Mercy' }); },
        out: `Reyes sends it. The Spire hums, a note you feel in your back teeth, and four seconds of Halflight go out into the dark at the speed of light. Then there is nothing to do but walk down the hill and wait.`
      },
      {
        label: '“Come and join us. There is a world here.”', note: 'The burst drains 12 reserve power.', tags: { roots: 2, candor: 1 }, trust: { reyes: -3 }, log: 'hailed the Slow Mercy and invited her to settle',
        run: () => { gain('energy', -12); flag('mercy', 'join'); flag('hailed'); later(2, { ev: 'mercy_reply', label: 'A reply from the Slow Mercy' }); },
        out: s => `Reyes’s hand stops over the key. “*Join* us,” he says. Then, slowly: “It gets her here. Fine. It gets her here.” He sends it. The Spire hums.` + (s.flags.two_fires ? `` : ` Hadley, at the edge of the crowd, takes his cap off.`)
      },
      {
        label: '“Do not come. Mark this world lethal.”', note: 'The burst drains 12 reserve power. Nobody will come for you.',
        fx: { morale: -8 }, tags: { mercy: 2, arithmetic: 1 }, log: 'used the Spire to warn the Slow Mercy away',
        run: () => { gain('energy', -12); flag('mercy', 'warned'); flag('hailed'); trust('reyes', -18, 'used the Spire to warn the Slow Mercy away'); },
        out: `For a moment you think Reyes will refuse. Then he keys it in, letter by letter, his jaw working. Six hundred people will sail past Hesper and never know what the warning cost. Someone in the crowd begins to weep. Reyes shuts down the Spire, pockets the key, and walks down the hill alone.`
      },
      {
        label: 'Send our names, every one, the living and the dead. Let them decide.', note: 'The burst drains 12 reserve power.',
        tags: { candor: 2, consent: 1 }, log: 'hailed the Slow Mercy with the names of the colony',
        run: () => { gain('energy', -12); flag('mercy', 'come_get'); flag('hailed'); later(2, { ev: 'mercy_reply', label: 'A reply from the Slow Mercy' }); },
        out: s => `Reyes reads them into the key himself, ${s.pop + s.sleepers + s.dead} names, in the order of the manifest. It takes the whole burst. There is no request in it, no plan, no position: only who we were and who we are. “If that doesn’t turn her,” he says, “nothing would have.”`
      }
    ]
  },

  mercy_reply: {
    kind: 'story', title: 'Nine Hundred Days', site: 'ridge', who: 'reyes', gate: s => s.flags.mercy === 'come_get' || s.flags.mercy === 'join',
    text: () => [
      `The reply comes in the middle of a rest shift, and Reyes runs the whole length of the Keel in his socks to wake you.`,
      `A woman’s voice, compressed and steady. “Halflight, this is Captain-Governor Odalys Brandt, CSV *Slow Mercy.* We have your beam and your position. We had you logged as lost with all hands.” A pause that is longer than the lag. “We are burning to divert. Nine hundred days, give or take forty. Hold on. Whatever you have to do down there, hold on. *Mercy* out.”`,
      `Reyes plays it four times. Then he looks up. “Nine hundred days. How do we tell them that? Because out there they’re going to hear ‘rescue’ and think it means next span.”`
    ],
    choices: [
      {
        label: 'Tell them all of it. Nine hundred days.', fx: { morale: 7 }, tags: { candor: 1 }, log: 'told the colony the Slow Mercy was nine hundred days out',
        run: s => { flag('mercy_coming'); s.flags.hope = s.turn; },
        out: `You play the recording in the Commons, the whole of it, and then you say the number. There is a groan. Then somebody at the back shouts, “Nine hundred’s a number! We’ve never had a *number!*” and the laughter that follows is the realest sound you have heard on this world.`
      },
      {
        label: 'Tell them she is coming. Let “soon” do the rest.', risk: '“Soon” has a half-life', fx: { morale: 11 }, tags: { sealed: 1 }, log: 'told the colony the Slow Mercy was coming, and not when',
        run: s => { flag('mercy_coming'); s.flags.hope = s.turn; later(3, { h: 'soonSours', hidden: true, label: 'What “soon” means' }); },
        out: `You play them Brandt’s voice and cut the recording before the number. The Commons erupts. People are packing. Actually packing. Reyes watches from the door with the full recording in his pocket, and his face is very hard to read.`
      },
      {
        label: 'Tell them she is coming, and that it will be long.', note: 'The truth, sanded down.',
        fx: { morale: 9 }, tags: { candor: 1, sealed: 1 }, log: 'told the colony the Slow Mercy was coming, and that it would be long',
        run: s => { flag('mercy_coming'); s.flags.hope = s.turn; },
        out: `“Long,” Moreau repeats, at the Plate. “How long is long?” “Longer than you want,” you tell her. “Shorter than forever.” The cheering, when it comes, is the kind that knows it will have to last.`
      },
      {
        label: 'Answer her: one message, written by the whole colony.', note: 'Costs 8 reserve power.',
        fx: { energy: -8, morale: 9 }, tags: { candor: 1, commons: 1 }, trust: { reyes: 2 }, log: 'had the whole colony write the reply to the Slow Mercy',
        run: s => { flag('mercy_coming'); s.flags.hope = s.turn; },
        out: `The Commons spends a whole shift arguing over a hundred words. It is the best argument the colony has ever had. What goes out in the end says that nine hundred days is fine, and asks whether the *Slow Mercy* has any dogs. Reyes sends it with his hand flat on the key, grinning like a boy.`
      }
    ]
  }
});

Object.assign(HANDLERS, {
  storesFreeze: () => {
    mod({ id: 'nobao', label: 'The Tally House runs on fear and paperwork', k: 'parts', add: -2 });
    gain('morale', -3);
    return { k: 'bad', text: 'Without Bao, the Tally House runs on fear and paperwork. Salvage tallies are slipping, and the quiet trades that kept people in boots have stopped. The clerks will still buy hoarded scrap for rations.' };
  },
  curfewLapse: () => {
    if (S.flags.curfew !== 'reviewed') return null;
    flag('curfew', 'ended'); gain('morale', 2);
    return { k: 'good', text: 'The three-span curfew has lapsed on schedule. The Commons reviewed it, voted, and let it go. People are singing after third bell again.' };
  },
  skillsListLeak: () => {
    gain('morale', -3); infl('moreau', 5);
    return { k: 'bad', text: 'Someone has posted the Vault C list in the Commons, with the twenty-eight names that were not on it written underneath in a different hand. A welder’s daughter was pod twenty-one.' };
  },
  duskTrialDone: () => {
    if (S.flags.dusk !== 'trial') return null;
    flag('dusk', 'approved'); trust('adeyemi', 3, 'let her prove the duskbloom was safe');
    return { k: 'good', who: 'adeyemi', text: 'The duskbloom volunteers are healthy, and all twelve have silver behind their eyes. Dr. Adeyemi read her report to the Commons with the lamps off, to make the point. The beds at Duskbloom Flats can be laid.' };
  },
  soonSours: () => {
    gain('morale', -8); trust('moreau', -5, 'let the colony believe rescue was weeks away');
    return { k: 'bad', text: 'Somebody did the orbital arithmetic. “Soon” turns out to mean nine hundred days, and the colony learned it from a rack tech with a slate instead of from you.' };
  }
});

</script>
<script>
'use strict';
/* Events, part 3: the pool. Disasters, discoveries, private scenes, and what councillors do when they stop trusting you. */

const leaveForHollows = (n) => { S.hollowsPop = (S.hollowsPop || 0) + n; flag('two_fires'); flag('hollows', 'settled'); S.sites.hollows.stage = Math.max(1, S.sites.hollows.stage); };

Object.assign(EVENTS, {
  /* ---------- disasters ---------- */
  glarestorm: {
    kind: 'disaster', title: 'Glarestorm', site: 'mirror', who: 'reyes', pool: true, when: s => s.turn < sp(15),
    text: () => [
      `It comes off the Glare as a wall the color of rust, a hundred kilometres wide, and the Mirror Field stands between it and everything else. Hadley’s outriders give you six hours.`,
      `“Shutter the field and you lose a span of sun,” Reyes says. “Leave it open and I’ll be sweeping glass for a month. Or put every free hand out there with sandbags, and hope.”`
    ],
    choices: [
      {
        label: 'Shutter the field and ride it out.', note: 'No mirror power this span.', tags: { wrights: 1 }, log: 'shuttered the Mirror Field through the glarestorm',
        run: () => mod({ id: 'shutter', label: 'Mirror Field shuttered for the glarestorm', k: 'mirror', mul: 0, for: 1 }),
        out: `The heliostats fold face-down in ranks, like a field of people kneeling. The storm passes over for nine hours with a sound like poured gravel. When the mirrors open again, every one of them is whole.`
      },
      {
        label: 'Keep collecting until the leading edge.', note: '+6 reserve power.', logic: 'The Mirror Field loses 15 to 34%.', risk: 'The mirrors will take damage', tags: { arithmetic: 1 }, trust: { reyes: -3 }, log: 'kept the mirrors open into the glarestorm',
        run: s => { gain('energy', 6); s.tmp.d = rint(15, 34); fix('mirror', -s.tmp.d); },
        out: s => `You hold them open four hours too long. The reserve fattens. Then the leading edge arrives early, and the first rank of mirrors turns to frosted glass in the time it takes to say so. The Mirror Field has lost ${s.tmp.d} points of integrity.`
      },
      {
        label: 'Every free hand to the field with sandbags.', note: 'Hard work in a rising wind.', logic: '20% chance someone is caught outside and dies. The Mirror Field loses 6%.', risk: 'Someone may be caught outside', fx: { morale: -2 }, tags: { commons: 1 }, log: 'sandbagged the Mirror Field by hand',
        run: s => { fix('mirror', -6); s.tmp.hurt = chance(0.2); if (s.tmp.hurt) { s.tmp.name = npc('glare' + s.turn).name; kill(1); } },
        out: s => `Two hundred people fill sandbags in a rising wind with rags tied over their faces. The pylons hold. ` + (s.tmp.hurt
          ? `${s.tmp.name} is caught in the open when the front hits, and is found afterward forty metres from the lee wall. One dead.`
          : `Everyone is back inside the lee wall with eleven minutes to spare, and for a span afterward people greet each other by showing the grit still in their ears.`)
      },
      {
        label: 'Set the mirrors edge-on, and leave a skeleton crew to watch them.', note: 'Half the Mirror Field’s power this span. It loses 5 to 12%.',
        tags: { wrights: 1, arithmetic: 1 }, trust: { reyes: 1 }, log: 'turned the Mirror Field edge-on into the glarestorm',
        run: () => { mod({ id: 'shutter', label: 'Mirror Field edge-on through the glarestorm', k: 'mirror', mul: 0.5, for: 1 }); fix('mirror', -rint(5, 12)); },
        out: `Reyes sets the heliostats edge-on, like knives laid on their sides, and stays out with four volunteers and a wind gauge. They lose a few panels and half the span’s light, and come in looking sandpapered. Which, Reyes points out, they have been.`
      }
    ]
  },

  frostfall: {
    kind: 'disaster', title: 'Black Frost', site: 'ice', who: s => s.flags.two_fires ? null : 'hadley', pool: true, when: s => s.turn >= sp(3),
    text: () => [
      `A black frost comes down off the Lee without warning: air so cold it falls instead of blowing, and pools in the cut. By the time the shift whistle sounds, the haul road is under two metres of rime and the melt line has frozen solid along half its length.`,
      `No water is coming up from the Ice Works. The Racks have a day’s supply in the header tanks. The Hearth has less.`
    ],
    choices: [
      {
        label: 'Dig it out now, whatever the shift.', fx: { morale: -3 }, trust: { hadley: 2 }, log: 'dug out the Ice Works after the black frost',
        run: () => fix('ice', -8),
        out: `It takes two hundred people and nineteen hours, in relays, with the surgeon walking the line checking fingers. The water runs again before the header tanks are dry. Nobody thanks you. Several of them could not hold a spoon afterward.`
      },
      {
        label: 'Wait for it to lift. Ration the water.', note: 'Costs nothing today.', risk: 'The cut will suffer badly', log: 'waited out the black frost',
        run: () => fix('ice', -30),
        out: `The frost sits in the cut for most of a span. When it lifts, half the props have split and the haul road has slumped. The Ice Works is in a bad way.`
      },
      {
        label: 'Thaw the line with heat from the Hearth bus.', fx: { energy: -10 }, tags: { wrights: 1 }, log: 'thawed the Ice Works with Hearth power',
        run: () => fix('ice', -8),
        out: `Reyes strings heating cable down the melt line and feeds it straight off the bus. The lights in the Keel brown for an hour. The water runs. “That’s ten points of margin gone to melt ice,” he says, “on a planet that’s half ice.”`
      },
      {
        label: 'Drain the wreck’s old coolant tanks to carry the Racks through.', note: 'Costs 6 parts in pumps and hose. The Ice Works loses 16%.',
        fx: { parts: -6 }, tags: { arithmetic: 1 }, log: 'carried the Racks through the black frost on water from the wreck',
        run: () => fix('ice', -16),
        out: `The salvage crews tap the wreck’s dead coolant tanks with pumps scavenged from three different decks. The water is old and tastes of metal, and the Racks drink it anyway. The cut freezes harder while you wait, but nothing in the colony goes dry.`

    ]
  },

  duskfever: {
    kind: 'disaster', title: 'East Dormitory', site: 'infirm', pool: true, when: s => s.turn >= sp(4),
    weight: s => (s.policy.ration === 'lean' ? 2 : 1) * (s.flags.screened >= s.turn ? 0.3 : 1),
    enter: () => { npc('surgeon', 'the colony surgeon'); },
    text: () => [
      `The surgeon, ${npc('surgeon', 'the colony surgeon').name}, finds you in the corridor and steers you by the elbow into an empty store room, which is how you know it is serious.`,
      `“Eleven cases since last bell. Fever, a rash at the throat, and the lungs go fast in anyone already thin. It is moving through the east dormitory. I want that dormitory sealed.” A breath. “There is a case of fleet antivirals in the charter stores. Sealed for the destination colony. I’m told that isn’t us.”`
    ],
    choices: [
      {
        label: 'Seal the east dormitory.', note: 'Fewer hands on the Racks for two spans.', logic: s => s.flags.screened >= s.turn ? 'Screening is running, so nobody dies of it.' : 'With no screening running, up to two die before it is contained.', fx: { morale: -4 }, tags: { arithmetic: 1 }, log: 'quarantined the east dormitory',
        run: s => { mod({ id: 'quarantine', label: 'East dormitory under quarantine', k: 'racks', mul: 0.88, for: 2 }); s.tmp.d = s.flags.screened >= s.turn ? 0 : rint(0, 2); if (s.tmp.d) kill(s.tmp.d); },
        out: s => `The east dormitory doors are chained from the outside and food goes in through the laundry hatch. It burns out in nine days. ` + (s.tmp.d ? `${plural(s.tmp.d, 'person', 'people')} did not come out.` : `Everyone who went in comes out, thinner.`)
      },
      {
        label: 'Masks, and keep working. The colony cannot stop.', logic: s => `${s.flags.screened >= s.turn ? 20 : 50}% chance it spreads: four to eight die, and morale −6. Otherwise it stops at one death.`, risk: 'It may spread', tags: { arithmetic: 1 }, trust: { adeyemi: -3 }, log: 'kept the colony working through the fever',
        run: s => { s.tmp.bad = chance(s.flags.screened >= s.turn ? 0.2 : 0.5); s.tmp.d = s.tmp.bad ? rint(4, 8) : 1; kill(s.tmp.d); if (s.tmp.bad) gain('morale', -6); },
        out: s => s.tmp.bad
          ? `It is in every dormitory inside a span. The infirmary’s six beds become sixteen pallets in the corridor. ${s.tmp.d} people die before it burns out, and the surgeon stops meeting your eye.`
          : `The masks hold, or luck does. One death, an ice cutter who was already half starved. The surgeon tells you, evenly, that you should not take the lesson from this that you are tempted to take.`
      },
      {
        label: 'Break the seal on the charter antivirals.', fx: { morale: 2 }, tags: { mercy: 1, roots: 1 }, trust: { patience: -4 }, log: 'opened the charter antivirals to stop the fever',
        run: () => flag('reserve_drugs'),
        out: `The case hisses when the seal breaks, eleven light-years from where it was meant to. Sixty courses. The fever is over in four days. “I have logged a charter breach,” Patience says. “I have also logged that I would have advised it. Those are separate columns.”`
      },
      {
        label: 'Ask for volunteers to nurse the east dormitory from inside.', note: 'Sealed, with help on the inside.', logic: s => `The Racks lose 8% for two spans. ${s.flags.screened >= s.turn ? 'Screening is running, so nobody dies of it.' : 'With no screening running, up to two of the nurses may die.'}`, risk: 'The nurses may sicken',
        fx: { morale: 2 }, tags: { mercy: 2, consent: 1 }, log: 'sent volunteers into the sealed east dormitory to nurse the sick',
        run: s => { mod({ id: 'quarantine', label: 'East dormitory nursed from inside', k: 'racks', mul: 0.92, for: 2 }); s.tmp.d = s.flags.screened >= s.turn ? 0 : rint(0, 2); if (s.tmp.d) kill(s.tmp.d); },
        out: s => `Fourteen volunteers walk into the east dormitory with masks and blankets, and the doors are chained behind them. They nurse it from inside for two spans. ` + (s.tmp.d === 1 ? `One volunteer does not come out.` : s.tmp.d ? `${s.tmp.d} people do not come out, one of them a volunteer.` : `Everyone comes out, volunteers included, to a meal the whole Keel has saved up for.`)
      }
    ]
  },

  icefall: {
    kind: 'disaster', title: 'Three Slow, Three Fast', site: 'ice', who: s => s.flags.two_fires ? null : 'hadley', pool: true, when: s => s.turn >= sp(3),
    enter: () => { npc('miner', 'an ice cutter'); },
    text: () => [
      `The gallery roof comes down at the Ice Works a little after second bell. Six cutters are behind the fall. One of them, ${npc('miner', 'an ice cutter').name}, is banging on a pipe: three slow, three fast. They are alive, and they have perhaps a shift of air.`,
      `Hadley’s people say they can dig. Reyes says he can cut in faster with a plasma torch run off the Hearth bus. The shift boss says, very quietly, that the whole face is unstable and the next fall will take the rescuers too.`
    ],
    choices: [
      {
        label: 'Dig. Everyone, in relays, until they are out.', logic: '70% chance they are dug out alive: morale +6, and they will not forget it. Otherwise the face comes down: eight die, and morale −8. The Ice Works loses 10%.', risk: 'The face is unstable', tags: { mercy: 2 }, trust: { hadley: 3 }, log: 'dug for the trapped ice cutters',
        run: s => {
          s.tmp.ok = chance(0.7); fix('ice', -10);
          if (s.tmp.ok) { gain('morale', 6); flag('miner', 'saved'); later(rint(5, 8), { h: 'minerRepay', hidden: true, label: 'Six people who owe you their lives' }); }
          else { kill(8); gain('morale', -8); flag('miner', 'dead'); }
        },
        out: s => s.tmp.ok
          ? `Eleven hours. They come out one at a time through a hole the width of a pair of shoulders, grey with ice dust, into a crowd that has not gone home. ${npc('miner').first} is last, and the first thing ${npc('miner').first} says is, “Who’s on shift? That face needs propping.”`
          : `Nine hours in, the face lets go a second time. It takes two of the diggers with it and closes the gap for good. The pipe goes quiet a little after. Eight names for the Plate, and a silence in the Keel that lasts for days.`
      },
      {
        label: 'Let Reyes cut in with the torch.', logic: '90% chance the six come out alive: morale +5, and they will not forget it. Otherwise all six die: morale −6. The Ice Works loses 6%.', fx: { energy: -12 }, tags: { mercy: 1, wrights: 1 }, trust: { reyes: 2 }, log: 'cut through to the trapped ice cutters with a plasma torch',
        run: s => {
          s.tmp.ok = chance(0.9); fix('ice', -6);
          if (s.tmp.ok) { gain('morale', 5); flag('miner', 'saved'); later(rint(5, 8), { h: 'minerRepay', hidden: true, label: 'Six people who owe you their lives' }); }
          else { kill(6); gain('morale', -6); flag('miner', 'dead'); }
        },
        out: s => s.tmp.ok
          ? `The torch goes through four metres of ice and rubble like a hot wire. Reyes cuts the last half-metre by hand so as not to cook anyone. Six people walk out. The Keel browns out for an hour and nobody complains.`
          : `The torch is through in ninety minutes. It is not fast enough. The air behind the fall went bad sooner than anyone reckoned. Six names for the Plate.`
      },
      {
        label: 'Seal the gallery. Do not risk more lives.', fx: { morale: -6 }, tags: { arithmetic: 2 }, trust: { hadley: -5 }, log: 'sealed the gallery with six cutters behind the fall',
        run: () => { kill(6); flag('miner', 'lost'); later(4, { ev: 'the_sister', hidden: true, label: 'The sealed gallery' }); },
        out: `You give the order. The shift boss nods as if she had expected it, and hates that she did. The banging on the pipe goes on for another five hours. Half the colony stands at the cut and listens to all of it.`
      },
      {
        label: 'Drill an air line through first. Then dig slowly.', note: 'Costs 6 parts. Safer for the diggers, slower for the trapped.', logic: '80% chance the six come out alive: morale +5, and they will not forget it. Otherwise all six die: morale −6. The Ice Works loses 8% either way.', risk: 'Slow may be too slow',
        fx: { parts: -6 }, tags: { mercy: 1, arithmetic: 1, wrights: 1 }, trust: { hadley: 2 }, log: 'drilled air to the trapped cutters before digging',
        run: s => {
          s.tmp.ok = chance(0.8); fix('ice', -8);
          if (s.tmp.ok) { gain('morale', 5); flag('miner', 'saved'); later(rint(5, 8), { h: 'minerRepay', hidden: true, label: 'Six people who owe you their lives' }); }
          else { kill(6); gain('morale', -6); flag('miner', 'dead'); }
        },
        out: s => s.tmp.ok
          ? `The drill is through in three hours, and the first thing that comes back up the line is a voice asking whether anyone thought to bring tea. After that the digging can be careful. Six people come out on the second day, cold and starving and very much alive.`
          : `The air line reaches them in four hours. The face moves before the dig does, and the line goes quiet in the middle of a sentence. Six names for the Plate, and a length of pipe still sticking out of the ice, which nobody will touch.`
      }
    ]
  },

  the_sister: {
    kind: 'council', title: 'Six Names', site: 'keel', gate: s => s.flags.miner === 'lost',
    enter: () => { npc('sister', 'a welder'); },
    text: () => {
      const p = npc('sister', 'a welder'), m = npc('miner', 'an ice cutter');
      return [
        `She is waiting at the Plate when you come through the Commons. ${p.name}, ${p.role}. Her brother ${m.first} was behind the fall at the Ice Works when you sealed it.`,
        `She has a chisel in her hand, and for a moment the constable at the door starts forward. But she is only cutting. Six names, deep, in a row. She does not turn around. “I’d like to say something to you,” she says. “I’d like everyone to hear it.”`
      ];
    },
    choices: [
      {
        label: 'Let her speak.', fx: { morale: 2 }, tags: { candor: 1, mercy: 1 }, log: 'let a dead cutter’s sister speak at the Plate',
        out: `She speaks for four minutes. She does not call you a murderer. She says you did arithmetic, and that someone has to, and that she hopes it costs you something every time. Then she finishes the last letter of her brother’s name and hands you the chisel, because the Plate is the Governor’s to keep.`
      },
      {
        label: 'Have the constable see her home.', fx: { morale: -4 }, tags: { decree: 1, watch: 1 }, log: 'had a dead cutter’s sister removed from the Plate',
        out: `The constable is gentle about it. She goes without a struggle, and leaves the chisel standing in the unfinished groove of the sixth name. Nobody in the colony will touch it. It stays there, in the Plate, for the rest of your term.`
      },
      {
        label: 'Stand beside her, and answer every word in front of everyone.', note: 'She will not forgive you. She may believe you.',
        fx: { morale: 3 }, tags: { candor: 2 }, log: 'answered a dead cutter’s sister at the Plate',
        out: () => `${npc('sister').first} says all of it. Then you answer, point by point, while three hundred people listen: the face, the odds, the order, the six. She does not forgive you. But at the end she nods once, the way people nod at a debt that has at least been written down.`
      },
      {
        label: 'Make her warden of the Ice Works, with the power to stop any shift.', note: 'The Ice Works gains 8%. She may say no a lot.', trust: { moreau: 3, kovac: -3 }, why: { moreau: 'the people who dig should be able to stop the digging', kovac: 'it gives a stop order to someone outside the chain of command' },
        tags: { consent: 1, arithmetic: 1 }, log: 'made a dead cutter’s sister warden of the Ice Works',
        run: () => fix('ice', 8),
        out: () => `${npc('sister').first} stares at you as if you have handed her the chisel the wrong way round. Then she takes the job. For the rest of your term no crew goes into a gallery at the Ice Works without her say-so, and three times she says no.`
      }
    ]
  },

  /* ---------- discoveries ---------- */
  sealed_container: {
    kind: 'discovery', title: 'Container Seven', site: 'wreck', pool: true, when: s => s.turn >= sp(2) && s.turn < sp(16),
    who: s => s.flags.bao === 'arrested' ? 'patience' : 'bao',
    text: s => [

      s.flags.bao === 'arrested' ? `The crew chief has posted a guard on it, mostly against herself.` : `“Coffee,” Bao says, with real reverence. “Possibly whisky. I am told I should not speculate.”`,

    choices: [
      {
        label: 'Break the seal. “We are the destination.”', fx: { food: 12, parts: 14, morale: 4 }, tags: { roots: 1 }, trust: { patience: -5 }, log: 'opened the charter reserve',
        run: () => flag('reserve', 'opened'),
        out: `The seal parts with a sigh of eleven-year-old air. There is, in fact, coffee. You drink one cup standing in the cargo deck, and watch the people around you remember what a morning was.`

        run: () => flag('reserve', 'sealed'),
        out: `You have the container moved to the cage behind the charter cabinet and locked. Half the colony thinks you a fool. The other half is strangely steadied by it: somewhere, there is still a rule that holds.`
      },
      {
        label: 'Open it at the Plate, and let the Commons divide it.', fx: { food: 10, parts: 10, morale: 6 }, tags: { consent: 2, candor: 1 }, trust: { patience: -5, bao: -3 }, log: 'opened the charter reserve and let the Commons divide it',
        run: () => flag('reserve', 'opened'),

        out: `You break the seal on a single crate, the one stencilled with a red cross, and have the rest locked away again for the destination. The surgeon receives the antivirals as if they were relics. Patience records the breach in its log, in a typeface, it tells you, reserved for exceptions.`
      }
    ]

  pathfinder_cairn: {
    kind: 'discovery', title: 'The Pathfinder', site: 'ice', who: s => s.flags.two_fires ? null : 'hadley', pool: true, when: s => s.turn >= sp(4) && s.turn < sp(14),
    text: () => [
      `One of Hadley’s outriders has found something on the high shelf that is not rock: a squat grey drum, half buried in rime, with a fleet survey stencil on its flank. A pathfinder probe. It has been sitting on Hesper for sixty-one years, watching the sun and writing down what it saw.`,
      `Its isotope cell is still warm. Its memory holds six complete cycles of the libration. “It knows exactly how long the dark lasts,” ${S.flags.two_fires ? 'the outrider says' : 'Hadley says'}, “and how cold it gets, and when. It’s been waiting to tell someone.”`
    ],
    choices: [
      {
        label: 'Haul the isotope cell back to the Hearth bus.', note: '+5 power every span, in light or dark.', fx: { parts: -4 }, tags: { wrights: 1 }, log: 'hauled the pathfinder’s isotope cell to the Hearth',
        run: () => mod({ id: 'rtg', label: 'Pathfinder isotope cell on the bus', k: 'energy', add: 5 }),
        out: `It takes a sledge team three days to bring the cell in. Reyes wires it to the bus with something like tenderness. Five points of power, every span, in light or dark, for another forty years.`
      },
      {
        label: 'Leave it running. Take the record.', note: 'Heating costs less in the Dimming.', tags: { candor: 1, outriders: 1 }, trust: { patience: 2 }, log: 'took the pathfinder’s record and left it running',
        run: () => flag('cairn'),
        out: `Patience reads sixty-one years of data in the time it takes you to sit down. “Four spans of dark. Peak cold in the second and third. I can now tell the Wrights precisely where the heat will leak, and when.” The probe is left on its shelf, still watching. Someone ties a strip of yellow tape to it, for luck.`
      },
      {
        label: 'Strip it for parts.', fx: { parts: 16 }, tags: { arithmetic: 1 }, trust: { hadley: -3 }, log: 'stripped the pathfinder probe for parts',
        out: s => `It comes apart into sixteen crates of very good fleet engineering. ${s.flags.two_fires ? 'The outrider who found it' : 'Hadley'} watches the crates go by. “Sixty-one years,” ${s.flags.two_fires ? 'she' : 'he'} says. “And we’re the ones it met.”`
      },
      {
        label: 'Take the record, then haul the cell home as well.', note: 'Costs 10 parts and a hard span. The record, and +3 power every span, in light or dark.',
        fx: { parts: -10, morale: -1 }, tags: { wrights: 1, outriders: 1 }, trust: { patience: 1 }, log: 'took the pathfinder’s record and its isotope cell',
        run: () => { flag('cairn'); mod({ id: 'rtg', label: 'Pathfinder isotope cell on the bus', k: 'energy', add: 3 }); },
        out: s => `Patience copies the record in one long breath down a cable run out across the shelf, and then the sledge team pulls the cell. The probe goes dark after sixty-one years. ` + (s.flags.two_fires ? `The outrider who found it stands beside it a while before letting them load it.` : `Hadley stands beside it a while before he lets them load it. “It did its job,” he says. “Longer than most.”`)
      }
    ]
  },

  /* ---------- politics ---------- */
  market_day: {
    kind: 'politics', title: 'Chits', site: 'stores', who: 'bao', pool: true, when: s => s.turn >= sp(3) && s.turn < sp(15) && s.flags.bao !== 'arrested',
    text: () => [
      `Bao lays a row of stamped discs on your desk: hull steel, each the size of a thumbnail, each punched with a number. “Chits. I have been using them informally. A cutter covers a rack tech’s shift, she pays him a chit, he spends it with me on a pair of boots I happen to have. Nothing leaves the common store that wasn’t going to. Things simply get to the people who want them.”`,
      `“And three spans from now,” says Moreau, “a dozen people hold all the chits, and the rest hold their hands out.”`,
      `“That,” Bao concedes, “is also how it works.”`
    ],
    choices: [
      {
        label: 'Charter the market. Chits are legal tender.', note: '+2 parts a span from salvage that starts moving.', fx: { morale: 3 }, tags: { market: 2 }, infl: { bao: 8 }, log: 'chartered Bao’s chit market',
        run: () => { flag('market', 'open'); mod({ id: 'market', label: 'The chit market moves salvage', k: 'parts', add: 2 }); later(4, { h: 'chitDebt', hidden: true, label: 'The chit market' }); },
        out: `Within a span there is a market in the Tally House forecourt every rest shift: boots, repairs, haircuts, a woman who will tell your fortune from a ration tin. Salvage that used to sit in lockers starts moving. Bao takes a twentieth of everything and writes it down.`
      },
      {
        label: 'One market day a span. Rations and medicine excluded.', note: '+1 part a span.', fx: { morale: 2 }, tags: { market: 1, consent: 1 }, log: 'allowed a limited market day',
        run: () => { flag('market', 'limited'); mod({ id: 'market', label: 'Market day moves salvage', k: 'parts', add: 1 }); },
        out: `Bao accepts the limits with a small bow, like a man who asked for the moon and was given a good lamp. Market day becomes the thing people count the span by.`
      },
      {
        label: 'No. Everything stays in the common store.', tags: { decree: 1, commons: 1 }, trust: { bao: -5 }, log: 'forbade the chit market',
        run: () => flag('market', 'closed'),
        out: `Bao sweeps the chits back into his pocket. “Then they will trade in the corridors, Governor, without a ledger. I only offered to keep the books.” He is right, as it turns out. You never see it. You only see that everyone has boots.`
      },
      {
        label: 'Let the Commons run the market, with Bao as its clerk.', note: '+1 part a span. Prices on a public board.',
        fx: { morale: 2 }, tags: { market: 1, commons: 1, consent: 1 }, trust: { moreau: 2 }, log: 'gave the market to the Commons with Bao as its clerk',
        run: () => { flag('market', 'limited'); mod({ id: 'market', label: 'The Commons market moves salvage', k: 'parts', add: 1 }); },
        out: `“A clerk,” Bao says, tasting the word. Then he smiles, because he has worked out that the clerk keeps the book. The Commons market opens on the next rest shift with a price board in Moreau’s handwriting, and for once nobody accuses anybody of anything.`
      }
    ]
  },

  commons_march: {

      `“We are not rioting,” she tells you, loudly enough to carry. “We are sitting down. We will get up when there is a date for a vote, and when the ration ledger is nailed to that wall where everyone can read it. Until then the Governor is welcome to run the pumps personally.”`,

  watch_ultimatum: {

    text: () => [
      `Kovač comes to your office in full uniform, with four constables, and leaves the constables outside the door. That, you understand, is a courtesy.`,
      `“I will be plain. The colony is coming apart, and the office you hold is not holding it. I held it for fourteen months. I am asking you to sign emergency powers to the Watch for the duration: rations, labor, movement. You keep the title. I do the work.” He lays the order on your desk, already drafted. “I am asking. I want it recorded that I asked first.”`
    ],
    choices: [
      {
        label: 'Sign it.', fx: { morale: -6 }, tags: { decree: 3, watch: 3 }, infl: { kovac: 15 }, trust: { kovac: 6 }, log: 'signed emergency powers over to the Watch',
        run: () => flag('martial'),
        out: `You sign. Kovač reads your signature as if checking it for forgery. “Thank you, Governor,” he says, and for the first time he sounds tired instead of hard. By the next bell there are constables on the Racks, the Stores and the lock. Everything runs. Nothing is said.`
      },
      {
        label: 'Refuse, and face him down.', logic: s => `Works if ${atLeast('morale', s.morale, 40)}, ${atLeast('Moreau’s trust', s.chars.moreau.trust, 55)}, or an assembly is sitting (${s.flags.assembly ? 'one is' : 'none is'}): Kovač stands down, and morale +3. Otherwise the Watch takes the Keel, and your term ends here.`, risk: 'It depends on who will stand with you', tags: { consent: 2 }, log: 'refused the Watch emergency powers',

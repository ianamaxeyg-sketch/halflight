          if (s.tmp.ok) { infl('kovac', -18); gain('morale', 3); trust('kovac', 8, 'faced him down and did not break'); } else S.ending = 'coup';
        },
        out: s => s.tmp.ok
          ? `“No,” you say. Then you open the office door, so that the corridor can hear the rest. The corridor is full. It is full of rack techs and cutters and stewards, and none of them move aside for the four constables. Kovač looks at them for a long moment. Then he picks up the unsigned order, folds it in three, and puts it in his breast pocket. “Governor,” he says. He does not ask again.`
          : `“No,” you say. Kovač nods, as if he had expected it, and opens the door. The corridor is empty except for his constables. Nobody has come to stand with you. “Then I relieve you,” he says, “under the article of the charter that covers incapacity. I am sorry. I did ask.”`
      },
      {
        label: `Offer him the Dimming: full authority for those ${numW(DIM_END - DIM_START + 1)} spans only.`, tags: { decree: 2, watch: 1 }, trust: { kovac: 8, moreau: -4 }, infl: { kovac: 6 }, log: 'gave the Watch emergency powers for the Dimming only',
        run: () => flag('martial_dim'),
        out: `Kovač reads the amended order twice. “A term,” he says. “With an end written on it.” He looks, briefly, almost grateful. “I have wanted an end written on it for four hundred days.” He signs beneath your name.`

        label: 'Call the council into the room, now, and let him make his case to all of them.', logic: s => `Works if ${atLeast('council trust', avgTrust(s), 45)}: the council votes him down, and the Watch answers to it. Otherwise the council gives Kovač full authority for the Dimming.`, risk: 'They may side with him',
        tags: { consent: 2, candor: 1 }, log: 'made Kovač argue for emergency powers before the whole council',
        run: s => { s.tmp.ok = avgTrust() >= 45; if (s.tmp.ok) { infl('kovac', -12); trust('kovac', 4, 'made him argue his case before the council'); } else { flag('martial_dim'); infl('kovac', 6); } },
        out: s => s.tmp.ok
          ? `Kovač makes his case well, and in full, to the tired faces round the long table. Then they vote. Against, by a clear margin. He takes off his cap. “Then I serve the council,” he says, and seems, of all things, relieved.`
          : `Kovač makes his case well, and the council hears it in a silence that tells you how it will go. They give him the Dimming: full authority for the ${numW(DIM_END - DIM_START + 1)} dark spans, and not a shift longer. Nobody looks at you while they vote.`
      }
    ]
  },

  exodus: {
    kind: 'politics', title: 'Loaded Sledges', site: 'ice', who: 'hadley', pool: true, weight: 6,
    when: s => s.turn >= sp(9) && s.chars.hadley.trust < 28 && s.sites.hollows.known && s.flags.hollows !== 'settled',
    text: () => [
      `The outriders are at the lock with loaded sledges. Forty people, more or less: Hadley’s survey crews, a dozen ice cutters, some families. They are not shouting. They are checking each other’s harness.`,
      `“We’re going to the Hollows,” Hadley says. “I’ve stopped asking. I’m not taking anything that isn’t ours, and I’m not stopping anyone who wants to stay. But I’ve watched this ridge kill people for a year and a half, and I’m done watching.” He looks past you at the constables on the lock. “You can make this ugly. I’d rather you didn’t.”`
    ],
    choices: [
      {
        label: 'Let them go, with a fair share of the stores.', note: 'Forty people leave the ridge.', fx: { pop: -40 }, tags: { mercy: 1, consent: 1, outriders: 1 }, trust: { hadley: 8 }, log: 'let Hadley’s people leave for the Hollows with supplies',
        run: () => { gain('food', -8); leaveForHollows(40); },
        out: `You have the stores opened and count out their share yourself. Hadley watches you do it. At the lock he stops and, after a visible struggle, puts out his hand. “There’ll be a lamp at the Hollows,” he says. “If the ridge goes bad, you’ll see it from the shelf.”`
      },
      {
        label: 'Bar the lock. Nobody leaves.', logic: '55% chance they go anyway, unsupplied: four to nine die on the shelf, and the rest reach the Hollows.', risk: 'They may go anyway, unsupplied', fx: { morale: -6 }, tags: { decree: 2, watch: 2 }, log: 'barred the lock against Hadley’s exodus',
        run: s => {
          s.tmp.slip = chance(0.55); trust('hadley', -10, 'barred the lock against his people');
          if (s.tmp.slip) { const d = rint(4, 9); kill(d); gain('pop', -(40 - d)); leaveForHollows(40 - d); }
        },
        out: s => s.tmp.slip
          ? `The constables hold the lock. So the outriders go out through the salvage cut at the wreck in the dead of a rest shift, without sledges, without their share of the stores, into a black frost. Most of them reach the Hollows. Not all. Hadley sends back one message by lamp code: the names of those who did not.`
          : `The constables hold the lock, and after a long, bad hour the outriders stand down and unload their sledges. Hadley does not look at you. From that span on, no survey report reaches your desk that tells you anything you did not already know.`
      },
      {
        label: 'Walk out onto the shelf with them, and ask them to stay.', logic: s => `Works if ${atLeast('morale', s.morale, 45)}: they stay. Otherwise forty leave anyway, with 6 food.`, tags: { candor: 1 }, log: 'walked onto the shelf to ask Hadley’s people to stay',
        run: s => {
          s.tmp.ok = s.morale >= 45;
          if (s.tmp.ok) { trust('hadley', 14, 'walked out onto the shelf to ask him to stay'); if (s.flags.hollows !== 'refuge') flag('hollows', 'refuge'); }
          else { gain('pop', -40); gain('food', -6); leaveForHollows(40); }
        },
        out: s => s.tmp.ok
          ? `You walk out with them, two kilometres onto the shelf, in borrowed thermals. And there, where the lights of the Keel are small behind you, you tell Hadley that he was right about the Hollows, and that you want it built properly, by the whole colony, with him in charge of it. He stands a long time looking leeward. Then he turns the lead sledge around.`
          : `You walk out with them, two kilometres onto the shelf. You say everything there is to say. Hadley hears you out. “It’s a good speech,” he says. “You should have made it four spans ago.” He takes his share of the stores and goes. You walk back alone, and the lights of the Keel look very few.`
      },
      {
        label: 'Let them go, and send a radio and a trained Wright with them.', note: 'Forty people leave the ridge, with 8 food. The line between you stays open.',
        fx: { pop: -40, parts: -6 }, tags: { mercy: 1, outriders: 1, roots: 1 }, trust: { hadley: 10, reyes: -2 }, log: 'let Hadley’s people go to the Hollows with a radio and a Wright',
        run: () => { gain('food', -8); gain('morale', 2); leaveForHollows(40); },
        out: `You count out their stores, and then add a radio set and a young Wright described in Reyes’s report as “annoyingly competent.” Hadley shakes your hand at the lock, which he has never done. Two days later the radio crackles: they are in, it is fourteen degrees, and someone wants to know where the soup ladle went.`
      }

const TABLE = {
  kovac: `Kovač looks at the seat, then at you, then moves his cup four centimetres to make room. It is, for him, an embrace. Halfway through the meal he tells you, unprompted, which three constables can be trusted with anything, and which one cannot.`,
  adeyemi: `“Good,” says Dr. Adeyemi, “you can settle a bet.” She puts the green thing on your plate. It is a salad. It is made of four leaves, and it is the first you have seen since you woke. She watches you eat every one.`,
  reyes: `Reyes shoves over without looking up. He talks about the Hearth for twenty minutes, in loving and unnecessary detail, and somewhere in the middle of it you realize he is telling you exactly what will fail first in the dark, and what to do when it does.`,
  moreau: `Moreau raises one eyebrow as you sit. “People will talk,” she says. “Let them,” you say. She laughs, a real one, short and surprised. By the end of the meal she has told you which dormitory is frightened and which is merely tired, and that the difference will matter.`,
  bao: `“An honor,” says Bao, and pours you something from a flask that is on no manifest. It tastes of solvent and apricots. He explains, at length and with diagrams drawn in spilled water, where a prudent person might have put things by for a long night.`,
  hadley: `Hadley nods at the seat. He eats without talking. But when the lamps are turned down for the toast he leans over and says, very low, “If it goes bad, the west lock, not the main. The drift won’t have closed it.” It is the most valuable thing anyone says to you all night.`
};
const tableSeat = id => ({
  when: s => (s.scene.low || []).includes(id), label: 'Sit beside ' + CHARS[id].name + '.', trust: { [id]: 8 },
  log: 'sat beside ' + CHARS[id].short + ' at the last meal before the dark', out: TABLE[id]
});

  deep_dark: {

        : `It is forty below at the lock, and falling. Frost has crept a metre in from every outside wall of the Keel, and the breath of three hundred people hangs in the corridors like smoke.`;
      return [
        open,
        `Reyes brings you the heat budget on a single sheet. “This is the deep of it. Two spans. The Hearth is giving everything she has, and the reserve is ${Math.round(s.energy)} of ${s.cap}. If we carry every load we are carrying now, ${e.energyNet < 0 ? 'we lose ' + (-e.energyNet) + ' a span' : 'we hold'}. Something can go cold, and it is yours to say what.”`

    choices: [

        run: s => { mod({ id: 'halfheat', label: 'Dormitories on half heat', k: 'energyUse', mul: 0.84, for: 2 }); s.tmp.d = kill(rint(2, 5), 'cold'); },

        run: () => { mod({ id: 'darkracks', label: 'Upper Racks dark to save heat', k: 'racks', mul: 0.5, for: 2 }); mod({ id: 'darkracks2', label: 'Lamp load shed from the Racks', k: 'energyUse', mul: 0.86, for: 2 }); },
        out: `Dr. Adeyemi throws the breakers on the upper tiers herself, and stands in the dark among her plants for a while before she comes out. “They’ll come back,” she says. “Most of them. Feed people off the stores, and for pity’s sake keep them warm.”`

        run: s => {
          mod({ id: 'trickle', label: 'Vaults on trickle power', k: 'energyUse', mul: 0.88, for: 2 });

        out: s => `“I will comply,” Patience says. “I am recording that I advised otherwise. I am recording the pod numbers.” Over two spans, ${plural(s.tmp.d, 'lamp')} in the vaults ${s.tmp.d === 1 ? 'goes' : 'go'} from green to amber to nothing. The people in the Keel are warm, and do not ask why.`
      },

        label: 'Nothing goes cold. Run the Hearth past her plate rating.', note: 'A quarter more output for two spans. The Hearth pays for it.', logic: 'The Hearth loses 28%. 25% chance she scrams anyway: −22 reserve power.', risk: 'She may scram',

        out: `You show Reyes the reserve gauge. He looks at it for a long moment, and then at you, and something like respect happens to his face. “Well,” he says. “Somebody read the gauges.” The lamps stay lit. The dormitories stay warm. The vaults stay cold. It costs exactly what you put by to pay for it.`

  else if (a.creed <= -4) out.push('When the numbers and the people pointed different ways, you went with the numbers. Someone had to.');
  if (a.candor >= 3) out.push('You told them the truth, including the parts that frightened them.');
  else if (a.candor <= -3) out.push('You kept things from them for their own good, and they found out.');
  if (a.horizon >= 4) out.push('And you treated Hesper as a place to live.');

      : 'went on feeding three hundred people out of a bay built for ninety, and went on telling you precisely what she thought of your priorities.';
    case 'reyes': return hi ? 'named the rebuilt cold leg after you, which he insists is not a compliment.' + dan
      : lo ? (f.daniyar === 'dead' ? 'runs the Hearth by the book, to the watt. He has never forgiven you for C-31, and has never said so.' : 'runs the Hearth by the book, to the watt. He speaks to you when a gauge requires it.')
      : 'kept the Hearth alive and his opinions to himself, mostly.' + dan;
    case 'moreau': return hi ? 'still tells you, in public, every time you are wrong. She has started doing it with a certain fondness.'
      : lo ? 'teaches the children of Halflight their letters, their rights and your term, in that order, as a cautionary lesson.'
      : 'never quite decided whether you were the governor the colony needed or only the one it got. She kept both lists.';
    case 'bao': return f.bao === 'arrested' ? 'served his sentence on the ice-haul crew, cheerfully, and by the end of it was running the ice-haul crew.'
      : f.salvage_rights ? 'holds the salvage rights to the wreck, in writing, over your signature. He has never once mentioned it, which is how you know what it is worth.'
      : hi ? 'has a page in his favor book with your name on it. He showed it to you once. The balance, he says, is in your favor, and he intends to keep it there.'
      : lo ? 'still keeps a second set of books. You are in them, in the column he reserves for bad debts.'
      : 'went on finding things. You went on not asking where.';
    case 'hadley': return f.two_fires ? (hi ? 'keeps a lamp burning at the Hollows, and a bunk there with your name chalked on it, in case.' : 'keeps a lamp burning at the Hollows. He has not been back to the ridge.')
      : hi ? 'drew you a map of everything he has found leeward, by hand, and signed it. It is the only thing he has ever signed.'
      : lo ? 'walks a little ahead of you still, whenever your paths cross.'
      : 'still spends more shifts on the shelf than under a roof. He files his reports. He does not linger.';
    default: return f.patience === 'muted' ? 'runs the vaults, and nothing else, exactly as ordered. Some of the colonists still say goodnight to the dark panels.'
      : hi ? 'has started saying good morning. Nobody instructed it to. It is still counting; it has simply decided to tell you when the count is good.'
      : lo ? 'complies. It records that it advised otherwise. The record is now very long.'
      : 'reports to the governing authority, as it always has. It does not say what it thinks of the governing authority.';
  }
}

<script>
'use strict';
/* Events, part 5: the wider pool. Daytime matters for the spans the story leaves room in, and a pool for the dark
   (dark: true), drawn only during the Dimming. startSpan() tops every span up to SPAN_MIN matters from these. */
Object.assign(EVENTS, {
  /* ---------- daytime pool ---------- */
  ration_thief: {
    kind: 'politics', title: 'Four Bricks', site: 'stores', who: 'kovac', pool: true, when: s => s.turn >= sp(2) && s.turn < sp(13),
    enter: () => { npc('thief', 'a rack apprentice'); },
    text: () => {
      const p = npc('thief', 'a rack apprentice');
      return [
        `The Watch brings him in by the collar: ${p.name}, sixteen, ${p.role}, with four ration bricks inside his coat and a fifth already half eaten. He does not deny it. His mother is in the east dormitory with a cough that will not shift, and the infirmary ration, he says, is a joke.`,
        `Kovač stands by the door. “The charter is plain. Theft from the common store is the worst crime this colony has. If it goes unpunished, it is permitted.” Moreau has heard, and is standing behind him, saying nothing in a way that is very loud.`
      ];
    },
    choices: [
      {
        label: 'Half rations for two spans, by the book.', note: 'The law holds, and everyone sees it hold.',
        fx: { morale: -1 }, tags: { decree: 1, watch: 1 }, trust: { kovac: 3 }, log: 'had a ration thief punished by the book',
        out: () => `${npc('thief').first} takes the sentence without a word, and the bricks go back on the shelf. That night somebody leaves a quarter of their own ration outside his mother’s bunk, and then somebody else does, and the Watch is careful not to notice.`
      },
      {
        label: 'Let him keep what he took. Send the surgeon to his mother.', note: 'Mercy. Others will try their luck.',
        fx: { food: -5 }, tags: { mercy: 2 }, trust: { kovac: -4 }, log: 'pardoned a ration thief and sent the surgeon to his mother',
        out: `Kovač says nothing at all, which is worse than an objection. The surgeon finds a lung infection, treatable, and treats it. By the next span three more mothers in the east dormitory have developed coughs. Some of them are real.`
      },
      {
        label: 'Put him on the Racks, on the full plate. His mother eats too.', note: 'A plate earned.',
        fx: { food: -2 }, tags: { arithmetic: 1, growers: 1 }, trust: { adeyemi: 2 }, log: 'put a ration thief to work on the Racks',
        out: () => `Dr. Adeyemi puts ${npc('thief').first} on the night shift and works him until he falls asleep standing up. He is good, it turns out. By the end of the span he is the one catching everyone else’s mistakes, and his mother’s cough has turned the corner.`
      },
      {
        label: 'Let his own dormitory decide what he owes.', logic: s => `Works if ${atLeast('morale', s.morale, 35)}: the dormitory settles it. Otherwise it ends in a scuffle and the Watch: morale −2.`,
        tags: { consent: 1, commons: 1 }, trust: { moreau: 2 }, log: 'let a ration thief’s dormitory decide his sentence',
        run: s => { s.tmp.ok = s.morale >= 35; if (!s.tmp.ok) gain('morale', -2); },
        out: s => s.tmp.ok
          ? `His dormitory meets in the corridor and settles it in an hour: he works their rest shifts for a span, and they feed his mother from their own plates. It is harsher than the Watch would have been, and kinder.`
          : `His dormitory meets in the corridor and cannot agree. It ends in shouting, then in a scuffle, and then with the Watch called after all. Kovač does not say he told you so. He does not have to.`
      }
    ]
  },
  aft_deck: {
    kind: 'discovery', title: 'The Ice Cube', site: 'wreck', pool: true, when: s => s.turn >= sp(2) && s.turn < sp(15),
    who: s => s.flags.bao === 'arrested' ? 'patience' : 'bao',
    text: s => [
      `A salvage crew working under the aft section has broken into a deck that was never on the plans: an engineering store, sealed since the landing, stacked to the ceiling with drive-room spares. Most of it is locked inside a block of frozen coolant the size of a dormitory.`,
      (s.flags.bao === 'arrested' ? `“Wonderful things,” says the crew chief, “all of them inside a very large ice cube.”` : `“Wonderful things,” says Bao, who has come to look for himself, “all of them inside a very large ice cube.”`) +
      ` Patience adds that the aft vault feed runs eleven centimetres from the obvious place to cut, and that it would prefer the governing authority to be aware of that.`
    ],
    choices: [
      {
        label: 'Cut in now, carefully.', note: '+14 parts.', logic: '25% chance the cut nicks the vault feed: the Wreck loses 15%.', risk: 'The vault feed is close',
        fx: { parts: 14 }, tags: { arithmetic: 1 }, trust: { patience: -2 }, log: 'had the frozen engineering deck cut open at once',
        run: s => { s.tmp.bad = chance(0.25); if (s.tmp.bad) fix('wreck', -15); },
        out: s => s.tmp.bad
          ? `The cutters are through in a shift and the spares come out by the crate. On the last cut the feed line splits. Patience holds the aft vault on its backup loop while the Wrights weld it shut, and for an hour nobody in the wreck breathes properly.`
          : `The cutters are through in a shift, and the spares come out by the crate: pump seals, bearings, a whole case of the fittings Reyes has been machining by hand for a year. The vault feed is never touched. Patience sounds almost disappointed not to have been right.`
      },
      {
        label: 'Thaw it slowly with heat from the Hearth bus.', note: 'Costs 8 reserve power. +12 parts, safely.',
        fx: { energy: -8, parts: 12 }, tags: { wrights: 1 }, trust: { reyes: 1 }, log: 'thawed the frozen engineering deck with Hearth power',
        out: `Reyes runs a heating cable down from the bus and lets the block weep for a span. It is slow and it is wet and the whole aft section smells of glycol, but everything comes out whole, the vault feed included.`
      },
      {
        label: 'Let Patience map it and plan the cut.', note: 'Slower. The best haul, in two spans.',
        tags: { ship: 1 }, trust: { patience: 3 }, log: 'had Patience map the frozen deck before cutting',
        run: () => later(2, { h: 'deckCut', label: 'The frozen engineering deck' }),
        out: `Patience asks for two spans and a borrowed sonar head from the Ice Works. It maps the block to the centimetre and paints the cut lines on the ice itself, in luminous orange, with small arrows. The salvage crews say it is like being supervised by a very polite god.`
      },
      {
        label: 'Leave it frozen. The vaults come first.', note: 'Nothing gained. Nothing risked.',
        tags: { sleepers: 1 }, trust: { patience: 2, bao: -2 }, log: 'left the frozen deck sealed for the sake of the vaults',
        out: s => `The hatch is welded shut again with a stencil across it: *VAULT SAFETY, DO NOT CUT.* ` + (s.flags.bao === 'arrested' ? `The crew chief looks at it for a long time before walking away.` : `Bao touches the stencil once, the way other people touch the Plate, and walks away.`)
      }
    ]
  },
  water_share: {
    kind: 'council', title: 'Two Thirsts', site: 'ice', who: 'adeyemi', pool: true, weight: 1.2,
    when: s => s.turn >= sp(4) && s.turn < sp(16) && s.sites.ice.integ < 75,
    text: () => [
      `The melt line from the Ice Works is running at two-thirds, and the Racks and the Hearth drink from the same pipe. Dr. Adeyemi and Reyes arrive at your office within a minute of each other, which you suspect is not a coincidence, and both start talking at once.`,
      `Plants die without water, says Dr. Adeyemi. Reactors without coolant do something much worse, says Reyes. They agree on one thing: somebody has to go short, and it should be the other one.`
    ],
    choices: [
      {
        label: 'The Racks drink first.', note: 'The Hearth runs at 90% for two spans.',
        tags: { growers: 2 }, trust: { reyes: -2 }, log: 'gave the Racks first call on the melt water',
        run: () => mod({ id: 'water', label: 'Hearth on short coolant', k: 'hearth', mul: 0.9, for: 2 }),
        out: `Reyes throttles the Hearth back himself, with the expression of a man being made to drive with the brake on. Dr. Adeyemi thanks you, then goes to thank him, which he takes worse.`
      },
      {
        label: 'The Hearth drinks first.', note: 'The Racks yield 10% less for two spans.',
        tags: { wrights: 2 }, trust: { adeyemi: -2 }, log: 'gave the Hearth first call on the melt water',
        run: () => mod({ id: 'water', label: 'Racks on short water', k: 'racks', mul: 0.9, for: 2 }),
        out: `Dr. Adeyemi turns the drip lines down tier by tier, talking to the seedlings in a low voice, as if apologizing. Reyes hears about it and comes to help without being asked, which she takes worse.`
      },
      {
        label: 'Split it evenly, and both of you stop arguing.', note: 'Both lose 5% for two spans.',
        tags: { arithmetic: 1 }, log: 'split the melt water evenly between the Racks and the Hearth',
        run: () => { mod({ id: 'water', label: 'Racks on short water', k: 'racks', mul: 0.95, for: 2 }); mod({ id: 'water2', label: 'Hearth on short coolant', k: 'hearth', mul: 0.95, for: 2 }); },
        out: `Neither of them is happy, which is how you know it is about right. They leave your office together, still arguing, and are seen an hour later at the long table, still arguing, sharing a plate.`
      },
      {
        label: 'Cut a second melt line, so nobody goes short.', note: 'Costs 10 parts. The Ice Works gains 15%.',
        fx: { parts: -10 }, tags: { wrights: 1, growers: 1 }, log: 'had a second melt line cut at the Ice Works',
        run: () => fix('ice', 15),
        out: `The second line takes a span to cut and half the parts bin to plumb. When the water comes through, Reyes and Dr. Adeyemi stand at the header tank together and watch it fill, like two people watching a fire.`
      }
    ]
  },
  the_school: {
    kind: 'politics', title: 'Thirty-One', site: 'keel', who: 'moreau', pool: true, when: s => s.turn >= sp(3) && s.turn < sp(14),
    text: () => [
      `There are thirty-one children awake in Halflight, and none of them has had a lesson since landfall. The oldest can strip a pump. The youngest can recite the evacuation drill. Nobody has taught any of them to read anything but a gauge.`,
      `Moreau has three teachers on the manifest and a room picked out. All three are on the labor roster, and the Racks are already short. “They will run this colony one day,” she says. “I would like them to be able to read its charter when they do.”`
    ],
    choices: [
      {
        label: 'Open the school. Three teachers, full time.', note: 'The Racks lose 4% for four spans.',
        fx: { morale: 4 }, tags: { mercy: 1, commons: 1, roots: 1 }, trust: { moreau: 3 }, log: 'opened a school for the colony’s children',
        run: () => mod({ id: 'school', label: 'Three teachers off the labor roster', k: 'racks', mul: 0.96, for: 4 }),
        out: `The school opens in a store room with a chalkboard cut from hull plate. On the first morning a crowd of adults stands in the corridor outside, listening to thirty-one children chant the alphabet, and several of them have to go away for a minute.`
      },
      {
        label: 'Evening classes after shift. Volunteers teach.', note: 'Slower. Free.',
        fx: { morale: 2 }, tags: { consent: 1, commons: 1 }, trust: { moreau: 1 }, log: 'set up evening classes taught by volunteers',
        out: `Volunteers teach whatever they know, which turns out to be a great deal: hydroponics, knots, three languages, the rules of a card game nobody else has heard of. The children learn all of it. Moreau calls it a school. Nobody argues.`
      },
      {
        label: 'Patience can teach them through the wall panels.', note: 'No hands lost. The ship becomes their teacher.',
        req: s => s.flags.patience !== 'muted' || 'Patience is confined to the wreck',
        fx: { morale: 1 }, tags: { ship: 2 }, trust: { patience: 3, moreau: -2 }, log: 'had Patience teach the colony’s children',
        out: `Patience turns out to be a patient teacher, which nobody had thought to expect. Within a span the children are reading, counting in three bases, and calling the wall panels by a nickname Patience pretends not to know about.`
      },
      {
        label: '“They can learn on the Racks, like everyone else.”', note: 'The work comes first.',
        fx: { food: 3, morale: -3 }, tags: { arithmetic: 2 }, trust: { moreau: -4 }, log: 'refused to take teachers off the labor roster',
        out: `Moreau writes the alphabet on the wall of the third rack line, in chalk, at a child’s eye height, and leaves it there. Nobody wipes it off. By the end of the span the children are using it, between trays.`
      }
    ]
  },
  the_still: {
    kind: 'politics', title: 'Rack Spirit', site: 'stores', who: 'kovac', pool: true, when: s => s.turn >= sp(4) && s.turn < sp(16),
    text: () => [
      `The Watch has found a still in a dead air duct behind the east dormitory: two salvaged pressure vessels and a coil of coolant pipe, turning rack waste into something clear that takes the skin off your tongue. Half the night shift has been drinking there for a span.`,
      `Kovač has the still in a crate and the names on a list. “Food into poison,” he says, “in a colony that is hungry.” Bao, for his part, has already tasted the evidence, and pronounces it promising.`
    ],
    choices: [
      {
        label: 'Smash it, and post the names.', note: 'Order. Resentment.',
        fx: { morale: -3 }, tags: { decree: 1, watch: 2 }, trust: { kovac: 3 }, log: 'had the still smashed and the drinkers named',
        out: `The still is broken up at the Plate, in front of everyone, by a constable who looks as if he would rather be anywhere else. The list goes up beside it. Within a span three of the names have been crossed out by someone, and two more added, as a joke.`
      },
      {
        label: 'License it. The Tally House runs it and pays a tithe in parts.', note: '+1 part a span.',
        fx: { morale: 2 }, tags: { market: 2 }, trust: { bao: 3, kovac: -2 }, log: 'licensed the still to the Tally House',
        run: () => mod({ id: 'still', label: 'The licensed still pays its tithe', k: 'parts', add: 1 }),
        out: `The still moves to a clean corner of the Tally House and acquires a name, a label and a price. People pay it in salvage, which goes on to the parts bin with a scrupulousness that convinces nobody. Kovač stops speaking to the Tally House for a span. The Tally House does not notice.`

      {

        fx: { food: -3, morale: 4 }, tags: { commons: 1, mercy: 1 }, log: 'made the still’s spirit a common ration on rest shifts',

  vault_frost: {
    kind: 'disaster', title: 'Frost Heave', site: 'wreck', who: 'patience', pool: true,

    text: () => [
      `The ground under the wreck is moving. Frost has worked into the permafrost beneath the vault deck and is lifting it, a millimetre a shift, and three pod seals in Vault B have cracked along their gaskets.`,
      `“The pods are holding temperature,” Patience says. “For now. Each cracked seal costs me margin I would rather spend elsewhere. I would like this treated as urgent, Governor. I am aware that everything is.”`

    choices: [
      {
        label: 'Reseal them properly.', note: 'Costs 10 parts. The Wreck gains 20%.',
        fx: { parts: -10 }, tags: { sleepers: 1 }, trust: { patience: 3 }, log: 'had the cracked vault seals replaced',

        out: `The Wrights replace the gaskets one pod at a time, with Patience reading out temperatures in a soft, continuous murmur, like a nurse taking a pulse. It takes a span. Not a degree is lost.`

      {
        label: 'Heat the deck and stop the heave.', note: 'Costs 10 reserve power. The Wreck gains 10%.',

        run: () => fix('wreck', 10),

      {
        label: 'Move the three pods into empty berths in Vault A.', note: 'Free. Moving a live pod is never safe.', logic: '40% chance one sleeper dies in the move. The Wreck gains 4% either way.', risk: 'A sleeper may die',
        tags: { arithmetic: 1 }, trust: { patience: -1 }, log: 'moved three cracked pods into Vault A',

          : `The pods make the journey across the wreck on a sledge, one at a time, with the whole Wright crew walking beside them like pallbearers who have been told good news. All three lamps stay green.`
      },
      {
        label: 'Patch the gaskets with sealant and move on.', note: 'Costs 2 parts. The Wreck keeps losing ground.',
        fx: { parts: -2 }, tags: { arithmetic: 1 }, trust: { patience: -3 }, log: 'had the cracked vault seals patched with sealant',
        run: () => fix('wreck', -10),
        out: `A crew goes round with sealant guns, and the cracks disappear under grey beads. Patience says nothing for the length of the job. Then, as the crew leaves: “The deck will keep moving, Governor. I will tell you when the beads fail.”`
      }

  },
  first_wedding: {
    kind: 'council', title: 'The Charter Has No Form', site: 'keel', pool: true, when: s => s.turn >= sp(3) && s.turn < sp(16),
    enter: () => { npc('wedA', 'a lamp fitter'); npc('wedB', 'an ice cutter'); },
    text: () => {
      const a = npc('wedA', 'a lamp fitter'), b = npc('wedB', 'an ice cutter');
      return [
        `${a.name}, ${a.role}, and ${b.name}, ${b.role}, come to your office together, holding hands and trying not to look as if they are. They would like to be married. They would like you to do it.`,
        `The charter has a form for births, deaths, landfall, mutiny and the disposal of hazardous waste. It has no form for this. Nobody planned for anyone to fall in love on the way.`
      ];
    },
    choices: [
      {
        label: 'Marry them yourself, at the Plate.', note: 'The Governor’s first wedding.',
        fx: { morale: 4 }, tags: { roots: 1 }, log: 'married two colonists at the Plate',
        out: () => `You write the form yourself, on the back of a ration chit, and marry them at the Plate with the whole Commons crowded in behind. ${npc('wedA').first} cries. ${npc('wedB').first} laughs. The rings are cut from a coolant pipe, and they are, everyone agrees, extremely good rings.`
      },
      {
        label: 'Ask Moreau to do it. The Commons should own this.', note: 'The Commons marries its own.',
        fx: { morale: 3 }, tags: { consent: 1, commons: 1 }, trust: { moreau: 3 }, log: 'asked Moreau to marry two colonists in the Commons',
        out: `Moreau is so surprised that she forgets to make a speech, and then remembers and makes two. The whole Commons says the vows back at the couple, which nobody planned, and which becomes, from that day, how it is done on Hesper.`
      },
      {
        label: 'Have Patience enter it in the ship’s log, as the charter would.', note: 'Legal, precise, and on the record for good.',
        fx: { morale: 2 }, tags: { ship: 1, return: 1 }, trust: { patience: 3 }, log: 'had Patience log the first marriage on Hesper',
        out: `Patience records the marriage with full formal headers, the time to the millisecond, and a note that it is the first entry of its kind in the history of the vessel. Then it plays a short piece of music nobody knew it had. The couple ask for it again.`
      },
      {
        label: 'Give them a rest shift, a double ration and the guest bunk.', note: 'Costs 2 food. A honeymoon, of sorts.',
        fx: { food: -2, morale: 3 }, tags: { mercy: 1 }, log: 'gave two newlyweds a rest shift and a double ration',
        out: `It is the smallest honeymoon in history, and by every account a success. When they come back on shift there is a sign on the guest bunk door in two hands, reading BOOKED, and a list of names underneath, waiting.`
      }
    ]
  },
  reyes_tired: {
    kind: 'council', title: 'Thirty Hours', site: 'hearth', who: 'reyes', pool: true, when: s => s.turn >= sp(5) && s.turn < sp(16),
    text: () => [
      `The surgeon finds you in the corridor. Reyes collapsed at the Hearth board an hour ago, after thirty hours on shift. He was out for under a minute, woke up swearing, and went straight back to the board, where he still is.`,
      `“There is nobody else qualified to sit that board alone,” the surgeon says. “Which is the problem, and also, I think, the point. He will not stop until someone makes him.”`
    ],
    choices: [
      {
        label: 'Order him off the board for a full span.', note: 'The Hearth runs at 92% without him.',
        fx: { morale: 1 }, tags: { mercy: 1 }, trust: { reyes: -2 }, log: 'ordered Reyes off shift for a full span',
        run: () => mod({ id: 'reyesrest', label: 'Reyes off shift', k: 'hearth', mul: 0.92, for: 1 }),
        out: `Reyes argues for ten minutes, then falls asleep in the middle of a sentence, sitting up. The constable you sent to walk him to his bunk carries him there instead. He sleeps for nineteen hours and wakes up furious and much nicer.`
      },
      {
        label: 'Give him two apprentices, whether he wants them or not.', note: 'Slower for three spans. Then a second pair of hands at the board.',
        tags: { wrights: 1, decree: 1 }, trust: { reyes: 1 }, log: 'assigned Reyes two apprentices at the Hearth',
        run: () => { mod({ id: 'apprentices', label: 'Apprentices learning the Hearth', k: 'hearth', mul: 0.96, for: 3 }); later(3, { h: 'apprenticesReady', label: 'Reyes’s apprentices' }); },
        out: `Reyes receives two apprentices with the warmth of a man receiving two head colds. He is a terrible teacher for one span and a merely bad one for the next. By the third he has started calling them “my two,” and defending them to anyone who will listen.`
      },
      {
        label: 'Let him work. The Hearth needs him more than he needs sleep.', note: 'No cost now.', logic: '30% chance of a tired mistake: the Hearth loses 12%.', risk: 'Tired hands make mistakes',
        tags: { arithmetic: 1 }, trust: { reyes: 2 }, log: 'let Reyes keep working through his exhaustion',
        run: s => { s.tmp.bad = chance(0.3); if (s.tmp.bad) fix('hearth', -12); },
        out: s => s.tmp.bad
          ? `Two shifts later he crosses two valves on the cold leg, and the Hearth spends a long hour deciding whether to forgive him. It does, mostly. He goes to sleep afterward without being asked, which frightens everyone more than the valves did.`
          : `He keeps working. He keeps the Hearth running. When the surgeon asks how, he says “coffee,” although there is no coffee, and nobody presses the point.`
      },
      {

    return { k: 'good', who: 'hadley', text: 'A sledge came in from the Hollows, unasked for, loaded with duskbloom. Food +8.' };
  }
});

<script>
'use strict';
/* Events, part 6: templated matters.
   A template is an ordinary pool event whose particulars (who brings it, where, the names and the numbers) are rolled
   by enter() when it comes up and kept in S.tp[id], so a save resumes it exactly. Text and choices are built from
   those particulars and must not roll anything themselves: they are rebuilt on every render. A choice that turns on
   chance rolls in its run(), like any written gamble. Unlike a written event a template comes back: drawPool() lets
   it recur `gap` spans after it last appeared, up to `max` times a term. Templates weigh less than written events,
   so they fill the spans the written pool has run out of rather than crowding it. */
const TP = id => (S && S.tp && S.tp[id]) || null;
function template(id, d) {
  EVENTS[id] = {
    kind: d.kind, pool: true, tpl: true, dark: !!d.dark, gap: d.gap || 5, max: d.max || 2, weight: d.weight || 0.6, when: d.when,
    enter: s => {
      s.tp = s.tp || {};
      const n = (s.tp[id] ? s.tp[id].n : 0) + 1;
      s.tp[id] = Object.assign(d.roll(s, n), { n });
      if (d.hit) d.hit(s, s.tp[id]);
    },
    get site() { const p = TP(id); return p ? p.site || null : null; },
    who: s => { const p = TP(id); return p && p.who && !away(p.who, s) ? p.who : null; },
    title: s => d.title(TP(id) || {}, s),
    text: s => d.text(TP(id) || {}, s),
    get choices() { const p = TP(id); return p ? d.choices(p, S) : []; }
  };
}
const OWNER = { racks: 'adeyemi', hearth: 'reyes', ice: 'hadley', wreck: 'patience', mirror: 'reyes', stores: 'bao', keel: 'moreau', infirm: null, ridge: 'hadley' };
const here = (id, s = S) => !!id && !!CHARS[id] && !away(id, s);
const crewFree = s => s.orders < crews() || 'Every crew is committed this span';
const SNAME = id => SITES[id].name;
const upper1 = t => t.charAt(0).toUpperCase() + t.slice(1);
/* A delayed outcome, decided when the choice is made and delivered n spans later in the span report. */
function after(n, label, data) { later(n, { h: 'tplLater', label, data }); }
Object.assign(HANDLERS, {
  tplLater: p => {
    const d = p.data || {};
    for (const k in d.fx || {}) gain(k, d.fx[k]);
    for (const id in d.integ || {}) S.sites[id].integ = clamp(S.sites[id].integ + d.integ[id], 5, 100);
    for (const id in d.trust || {}) trust(id, d.trust[id], d.note);
    if (d.kill) kill(d.kill, 'other');
    if (d.mod) mod(d.mod);
    return d.text ? { k: d.k || 'info', who: d.who && here(d.who) ? d.who : null, text: d.text } : null;
  }
});

/* ---- a machine fails at a working site ---- */
const BREAK = {
  racks: { parts: ['the nutrient pumps on the third tier', 'a bank of grow lamps', 'the condensate return'], role: 'a rack tech', tag: 'growers', k: 'racks', title: 'Dead Tier',
    open: (h, part, i) => `The third tier went quiet at second bell. ${h}, a rack tech, traced it to ${part}, and the trays are already warming. The Racks are at ${i}%, and every hour without flow costs leaves.`,
    say: 'Dr. Adeyemi wants a full crew on it. “Plants do not wait for paperwork.”' },
  hearth: { parts: ['a coolant valve on the secondary loop', 'the feedwater pump', 'a busbar junction'], role: 'a pump mechanic', tag: 'wrights', k: 'hearth', title: 'Pressure Drop',
    open: (h, part, i) => `The Hearth board lit amber in the middle of the night shift: ${part}. ${h}, a pump mechanic, has it isolated, but the loop is running hot and the Hearth is at ${i}%.`,
    say: 'Reyes wants new parts, not a patch. “Patches are how reactors become stories.”' },
  ice: { parts: ['the haul winch', 'the melt line heater', 'a cutting head'], role: 'an ice cutter', tag: 'outriders', k: null, title: 'Seized',
    open: (h, part, i) => `${upper1(part)} at the Ice Works seized with a full sledge on the slope. ${h}, an ice cutter, chocked it before anyone was hurt. The cut is at ${i}%, and the melt line is starting to skin over.`,
    say: 'Hadley would patch it and keep cutting. “The ice doesn’t care how it’s fixed.”' },
  wreck: { parts: ['a vault compressor', 'the seal heaters on row C', 'a coolant manifold under the vaults'], role: 'a salvage hand', tag: 'sleepers', k: null, title: 'Warm Vault',
    open: (h, part, i) => `The vault alarms caught it before anyone else did: ${part} is failing, and the temperature in six pods is creeping up. ${h}, a salvage hand, is down there with a torch and the manual. The vaults are at ${i}%.`,
    say: '“I can hold the pods for a span,” Patience says. “Not two.”' },
  mirror: { parts: ['an actuator bank', 'the tracking controller', 'a run of heliostat bearings'], role: 'a welder', tag: 'wrights', k: 'mirror', title: 'Blind Rank',
    open: (h, part, i) => `${upper1(part)} at the Mirror Field stopped tracking, and a whole rank of heliostats is staring at the ground. ${h}, a welder, climbed the first mast to look. The field is at ${i}%.`,
    say: 'Reyes shrugs. “Mirrors. Bolt them back on the sun and they forgive you.”' }
};
const workSites = s => Object.keys(BREAK).filter(k => k !== 'mirror' || lightAt(s.turn) > 0);
template('tpl_breakdown', {
  kind: 'disaster', max: 3, gap: 4,
  when: s => s.turn >= sp(2),
  roll: s => {
    const ids = workSites(s);
    let r = rnd() * ids.reduce((a, k) => a + 120 - s.sites[k].integ, 0), site = ids[ids.length - 1];
    for (const k of ids) { r -= 120 - s.sites[k].integ; if (r <= 0) { site = k; break; } }   /* worn sites fail more often */
    const b = BREAK[site];
    return { site, who: OWNER[site], part: pick(b.parts), hand: npc('brk' + s.turn, b.role).name, dmg: rint(8, 14), cost: rint(8, 12) };
  },
  hit: (s, p) => { s.sites[p.site].integ = clamp(s.sites[p.site].integ - p.dmg, 5, 100); p.i = s.sites[p.site].integ; },
  title: p => (BREAK[p.site] || {}).title || 'Breakdown',
  text: (p, s) => { const b = BREAK[p.site]; return b ? [b.open(p.hand, p.part, p.i), here(p.who, s) ? b.say : 'Nobody on the council is there to argue about it. It is yours.'] : []; },
  choices: p => {
    const b = BREAK[p.site], nm = SNAME(p.site), o = p.who, ot = d => (o ? { [o]: d } : null);
    return [
      { label: 'Put a crew on it today.', note: `Uses one of this span’s crews. ${nm} +${p.dmg + 12}%.`, req: crewFree, tags: { [b.tag]: 1 }, log: `put a crew on ${p.part}`,
        run: s => { s.orders++; fix(p.site, p.dmg + 12); },
        out: s => `${p.hand} gets four more pairs of hands and a whole shift. By last bell ${p.part} is running again, and ${nm} reads ${s.sites[p.site].integ}%.` },
      { label: 'Fit new components from stores.', note: `${nm} +${p.dmg + 18}%.`, fx: { parts: -p.cost }, tags: { [b.tag]: 1 }, trust: ot(2), log: `replaced ${p.part} with new stock`,
        run: () => fix(p.site, p.dmg + 18),
        out: s => `New parts come out of the stores still in their wrapping, which is a thing people stop to watch. ${nm} reads ${s.sites[p.site].integ}%.` },
      { label: 'Patch it with what is on hand.', note: `${nm} +${Math.round(p.dmg / 2)}%.`, logic: `45% chance the patch gives out within two spans: ${nm} −${p.dmg + 6}% then. Otherwise it holds.`,
        risk: 'The patch may not hold', tags: { arithmetic: 2 }, log: `patched ${p.part}`,
        run: () => {
          fix(p.site, Math.round(p.dmg / 2));
          const bad = chance(0.45);
          after(bad ? rint(1, 2) : 2, `Will the patch on ${p.part} hold?`, bad
            ? { integ: { [p.site]: -(p.dmg + 6) }, k: 'bad', who: o, text: `The patch on ${p.part} gave out. ${nm} −${p.dmg + 6}%.` }
            : { k: 'good', who: o, text: `The patch on ${p.part} is holding. Nobody quite believes it.` });
        },
        out: `${p.hand} does it with wire, sealant and a length of hose from somewhere nobody asks about. It runs. It sounds wrong, but it runs.` },
      b.k
        ? { label: `Run ${nm} short until the next overhaul.`, note: `${nm} output −15% for three spans. No crew, no parts.`, tags: { arithmetic: 2 }, trust: ot(-4), log: `ran ${nm} short`,
            run: () => mod({ id: 'tpl_short_' + p.site, label: `${upper1(p.part)} running short`, k: b.k, mul: 0.85, for: 3 }),
            out: `You let it limp. ${nm} gives what it can, and the people who work there learn the new sound of it.` }
        : { label: 'Leave it and keep an eye on it.', note: `${nm} −6% more. No crew, no parts.`, tags: { arithmetic: 2 }, trust: ot(-4), log: `left ${p.part} to wear`,
            run: s => { s.sites[p.site].integ = clamp(s.sites[p.site].integ - 6, 5, 100); },
            out: s => `It keeps going, more or less. ${nm} is down to ${s.sites[p.site].integ}%.` },
      { when: s => here(o, s) && s.chars[o].trust >= 50, label: `Let ${o ? CHARS[o].short : 'them'} call for volunteers on the rest shift.`, note: `Morale −2. ${nm} +${p.dmg + 10}%.`,
        fx: { morale: -2 }, tags: { commons: 1 }, trust: ot(3), log: `let volunteers fix ${p.part} on their rest shift`,
        run: () => fix(p.site, p.dmg + 10),
        out: 'They come, more of them than needed, and work through the rest shift on the strength of being asked. They are tired for a span. They are also proud of it.' }
    ];
  }
});

/* ---- two shifts fall out ---- */
const QUARREL = ['the bunks along the Hearth wall, the only warm ones in the ring', 'the order of the water queue at first bell', 'a rest shift that was promised to both of them',
  'a pair of boots that each of them says they made', 'the night lamps in the east dormitory', 'whose shift goes first on the Plate rota'];
template('tpl_quarrel', {
  kind: 'politics', max: 2, gap: 6,
  when: s => s.turn >= sp(3),
  roll: s => { const a = npc('qa' + s.turn), b = npc('qb' + s.turn); return { site: 'keel', who: here('moreau', s) ? 'moreau' : 'kovac', a: a.name, ar: a.role, b: b.name, br: b.role, what: pick(QUARREL) }; },
  title: () => 'Two Shifts',
  text: (p, s) => [
    `${p.a}, ${p.ar}, and ${p.b}, ${p.br}, have stopped speaking, and so have their shifts. It started over ${p.what}. By now it is about everything, and the mess line has split down the middle.`,
    here('moreau', s) ? 'Moreau thinks it belongs on the floor of the Commons. Kovač thinks it belongs nowhere at all.' : 'Kovač thinks it belongs nowhere at all, and says so.'
  ],
  choices: p => [
    { label: `Decide it yourself, for ${p.a}.`, note: 'Morale −1. Quick, and nobody can say it was not decided.', fx: { morale: -1 }, tags: { decree: 1 }, log: 'settled a quarrel between shifts by decree',
      out: `You hear them for five minutes each and give it to ${p.a}. ${p.b} takes it without a word, which is worse than taking it with several.` },
    { label: 'Put it to the Commons floor tonight.', logic: s => `Works if ${atLeast('Moreau’s trust', s.chars.moreau.trust, 40)}: the floor settles it, morale +2. Otherwise the floor turns on the council: morale −2.`,
      tags: { consent: 1, commons: 1 }, log: 'put a quarrel between shifts to the Commons',
      run: s => {
        const ok = s.chars.moreau.trust >= 40; gain('morale', ok ? 2 : -2);
        return ok ? 'The floor hears both sides, laughs at one of them, and votes. It is the laugh that settles it.' : 'The floor hears both sides and then turns on the council for letting it get this far. You stand there and take it.';
      } },
    { label: 'Draw lots for it, and post the rota.', note: 'Morale +1. Nobody wins, so nobody loses face.', fx: { morale: 1 }, tags: { arithmetic: 2 }, log: 'drew lots to settle a quarrel between shifts',
      out: `Two chits in a cup. ${p.b} draws, loses, and shrugs: a cup is not a person, and there is no holding a grudge against it.` },
    { label: 'Send the Watch to keep them apart.', note: 'Morale −2.', logic: '25% chance it comes to blows anyway: one of them is hurt, and morale −2 more.', risk: 'It may come to blows',
      fx: { morale: -2 }, tags: { watch: 2, decree: 1 }, log: 'sent the Watch into a quarrel between shifts',
      run: () => {
        if (chance(0.25)) { gain('morale', -2); return `It comes to blows anyway, at the water queue, with constables on both sides of it. ${p.b} goes to the infirmary with a cut over one eye.`; }
        return 'Constables at the water queue for a span. Nobody likes it. Nobody hits anybody.';
      } },
    { label: 'Leave them to sort it out.', logic: '50% chance they settle it themselves: morale +1 next span. Otherwise it festers: morale −3 next span.', trust: { moreau: -4 }, log: 'left a quarrel between shifts alone',
      run: () => after(1, `The quarrel between ${p.a} and ${p.b}`, chance(0.5)
        ? { fx: { morale: 1 }, k: 'good', text: `${p.a} and ${p.b} were seen sharing a pot of tea. Morale +1.` }
        : { fx: { morale: -3 }, k: 'bad', text: `The quarrel between ${p.a}’s shift and ${p.b}’s has spread to the Racks. Morale −3.` }),
      out: 'You let it be. Adults, you tell yourself, and you mostly believe it.' }
  ]
});

/* ---- something sealed in the wreck ---- */
const CACHE_AT = ['the cargo ring', 'the drive spine', 'a crew deck nobody had reached', 'the far end of the debris field'];
const CACHE_BOX = ['a sealed locker', 'a crate still in its foam', 'a medical cabinet', 'a seed locker'];
template('tpl_cache', {
  kind: 'discovery', max: 2, gap: 6,
  when: s => s.turn >= sp(2) && s.salvage > 0,
  roll: s => {
    const r = rnd(), c = r < 0.35 ? 'parts' : r < 0.65 ? 'food' : r < 0.85 ? 'letters' : 'none';
    return { site: 'wreck', who: here('bao', s) ? 'bao' : null, at: pick(CACHE_AT), box: pick(CACHE_BOX), hand: npc('cache' + s.turn, 'a salvage hand').name, c, amt: rint(14, 22) };
  },
  title: () => 'Sealed',
  text: p => [`${p.hand} and a salvage crew cut into ${p.at} and found ${p.box}, sealed since the fall and still holding pressure. Nobody has opened it. Half the wreck has come to look at it.`,
    'The manifest number is legible. What it says is in the ship’s records, if anybody asks the ship.'],
  choices: (p, s) => [
    { label: 'Cut it open here.', tags: { commons: 1, candor: 1 }, logic: 'It holds parts (35%), food (30%), letters and keepsakes (20%), or nothing that survived (15%).', log: `opened ${p.box} from the wreck`,
      run: () => {
        if (p.c === 'parts') { gain('parts', p.amt); return `Fittings, wire and a full set of drive-rated fasteners. Parts +${p.amt}.`; }
        if (p.c === 'food') { gain('food', p.amt - 4); return `Ration bricks, sealed and sound. Food +${p.amt - 4}.`; }
        if (p.c === 'letters') { gain('morale', 4); return 'Letters, photographs, a child’s drawing of a ship. They go up on the Commons wall, and people stand in front of them for a long time. Morale +4.'; }
        return `Whatever was in it did not survive the fall. ${p.hand} holds up a fistful of grey dust and lets it go.`;
      } },
    here('patience', s)
      ? { label: 'Ask Patience to open it by the manifest.', note: 'Patience opens it properly next span. Whatever is inside comes through intact, and a little more of it.', tags: { ship: 1 }, trust: { patience: 2 }, log: `gave ${p.box} to Patience to open`,
          run: () => {
            const k = p.c === 'none' ? 'parts' : p.c, n = k === 'letters' ? 5 : p.amt + 4;
            after(1, `Patience opens ${p.box}`, k === 'parts' ? { fx: { parts: n }, k: 'good', who: 'patience', text: `Patience opened ${p.box} by the manifest and found what a crew would have missed. Parts +${n}.` }
              : k === 'food' ? { fx: { food: n }, k: 'good', who: 'patience', text: `Patience opened ${p.box} by the manifest: ration bricks, and seed stock behind a false panel. Food +${n}.` }
              : { fx: { morale: n }, k: 'good', who: 'patience', text: `Patience opened ${p.box} by the manifest and read out every name on every letter. Morale +${n}.` });
          },
          out: '“Row nine, locker four,” Patience says. “I know what it holds. You will have it next span, opened properly.”' }
      : { label: 'Shelve it, sealed, in the common store.', note: 'Parts +8 when somebody finally opens it, in three to five spans.', tags: { arithmetic: 2 }, log: `stored ${p.box} unopened`,
          run: () => after(rint(3, 5), `${upper1(p.box)} on a shelf`, { fx: { parts: 8 }, k: 'info', text: `Somebody finally opened ${p.box} in the store. Parts +8.` }),
          out: 'It goes on a shelf with a chalk mark on it. Somebody will need it more than you do.' },
    here('bao', s)
      ? { label: 'Sell it sealed to the Tally House.', note: 'Parts +10, whatever is inside.', fx: { parts: 10 }, tags: { market: 1 }, trust: { bao: 2 }, log: `sold ${p.box} sealed to the Tally House`,

    { label: 'Return it unopened to the families on the manifest.', note: 'Morale +3.', fx: { morale: 3 }, tags: { mercy: 1, commons: 1 }, log: `returned ${p.box} to the families on its manifest`,
      out: 'The names on the manifest belong to people asleep in the vaults, or cut on the Plate. Their families open it together, in private, and come out holding each other.' }
  ]
});

/* ---- a petition from a work gang ---- */

    half: ['Food use +2% for four spans. Morale +1.', () => { gain('morale', 1); mod({ id: 'tpl_pet', label: 'Half a heavy-shift ration', k: 'foodUse', mul: 1.02, for: 4 }); }] },
  { ask: 'a rest shift every fourth day', full: ['The Racks −5% for four spans. Morale +4.', () => { gain('morale', 4); mod({ id: 'tpl_pet', label: 'A rest shift every fourth day', k: 'racks', mul: 0.95, for: 4 }); }],
    half: ['The Racks −2% for four spans. Morale +2.', () => { gain('morale', 2); mod({ id: 'tpl_pet', label: 'A rest shift every eighth day', k: 'racks', mul: 0.98, for: 4 }); }] },
  { ask: 'insulated boots before the cold comes', full: ['Parts −8. Morale +3.', () => gain('morale', 3), 8], half: ['Parts −4. Morale +1.', () => gain('morale', 1), 4] },
  { ask: 'a say when the shift rota is drawn up', full: ['Morale +3. Moreau’s sway +2.', () => { gain('morale', 3); infl('moreau', 2); }], half: ['Morale +1.', () => gain('morale', 1)] }
];
const GANGS = [['the ice cutters', 'an ice cutter', 'hadley'], ['the rack techs', 'a rack tech', 'adeyemi'], ['the vault crews', 'a salvage hand', 'patience'], ['the Hearth gang', 'a pump mechanic', 'reyes'], ['the lamp fitters', 'a lamp fitter', 'adeyemi']];

  kind: 'politics', max: 2, gap: 6,

  title: () => 'A Petition',
  text: p => [`${p.by} comes to your office with a sheet of paper folded and unfolded so often it has gone soft. ${upper1(p.gang)} are asking for ${ASKS[p.a].ask}. ${upper1(numW(p.names))} names, some of them only marks.`,
    `“We’re not asking for the moon,” ${p.by} says. “We’re asking for ${ASKS[p.a].ask}.”`],
  choices: p => {
    const a = ASKS[p.a], bt = d => (here(p.boss) ? { [p.boss]: d } : null);
    return [
      { label: 'Grant it in full.', note: a.full[0], fx: a.full[2] ? { parts: -a.full[2] } : null, tags: { consent: 1, mercy: 1 }, trust: bt(2), log: `granted ${p.gang} ${a.ask}`, run: a.full[1],
        out: `${p.by} reads your answer twice, folds the paper one more time, and goes to tell the others. You can hear them from the office.` },

        out: `“Half,” ${p.by} says. “Half is not nothing.” It is said the way people say things they have decided to believe.` },
      { label: 'Refuse. Not this term.', note: 'Morale −2.', fx: { morale: -2 }, tags: { decree: 1 }, trust: bt(-3), log: `refused a petition from ${p.gang}`,
        out: `${p.by} nods as if this were the answer they expected, which is the worst part.` },
      { label: 'Take it to the Commons floor.', logic: s => `Works if ${atLeast('Moreau’s trust', s.chars.moreau.trust, 45)}: granted in full with the floor behind it, and morale +1 more. Otherwise the floor halves it.`,
        tags: { consent: 2, commons: 1 }, log: `took a petition from ${p.gang} to the Commons`,

          const ok = s.chars.moreau.trust >= 45;

          if (a.half[2]) gain('parts', -Math.min(s.parts, a.half[2])); a.half[1]();
          return 'The floor argues it down to half. It is still the floor’s half, and that counts for something.';
        } }
    ];
  }
});

/* ---- someone hurt on shift ---- */

        run: () => {
          if (chance(0.7)) return `${p.hand} mends, slowly, on bandages and boiled water.`;

        } },

</script>
<script>
'use strict';
/* The field guide: how to read the screen, play a span, and start over. Rendered into the Guide tab. */
/* The heating schedule, read off heatAt() so it names the right spans for any term length. */
function heatLine() {
  const runs = [], say = { 1.15: '15% more', 1.35: 'a third more', 1.6: '60% more' };
  for (let t = 1; t <= LAST_SPAN; t++) { const h = heatAt(t), r = runs[runs.length - 1]; if (h <= 1) continue; if (r && r.h === h && r.b === t - 1) r.b = t; else runs.push({ h, a: t, b: t }); }
  return listAnd(runs.map((r, i) => (runs.slice(0, i).some(x => x.h === r.h) ? say[r.h] + ' again' : say[r.h] || Math.round((r.h - 1) * 100) + '% more') +
    ` in ${r.a === r.b ? 'span ' + r.a : 'spans ' + r.a + (r.b === r.a + 1 ? ' and ' : ' to ') + r.b}`));
}
function guideHTML() {
  const show = (id, what) => `<button class="btn small" data-act="point" data-id="${id}" aria-label="Show me ${what}">Show me</button>`;
  const cost = t => `<span class="fx">${t}</span>`;
  const sec = (id, title, body) => `<details data-k="g-${id}"${UI.open['g-' + id] ? ' open' : ''}><summary>${title}</summary><div class="g-body">${body}</div></details>`;
  const meta = loadMeta(), found = Object.keys(meta.endings).length, inh = hasInheritance(meta);

  const start = `<ol>
    <li><b>Read the span report.</b> It lists what changed since the last span. A plus is good news, a minus is bad, a cross is a loss. “Follows from span 3” means the line is the result of something you decided then. Press Continue.</li>
    <li><b>Decide the matter in front of you.</b> Each option shows what it costs or gains at once, any risk, and which councillors back or oppose it. Click an option or press its number. Decisions cannot be undone.</li>
    <li><b>Read the outcome</b> and press Continue. Most spans bring three matters. Some bring four.</li>
    <li><b>Give your work order.</b> When the story panel says “The span is yours”, click a site on the map, then an order in the panel under the map. Each order uses one crew for the span.</li>
    <li><b>Check the standing policy</b> under Colony if food or morale is sliding.</li>
    <li><b>Press End span.</b> The colony eats, burns power and wears down. The next report tells you how it went.</li>
  </ol>
  <p>A term lasts ${LAST_SPAN} spans. The sun is gone for spans ${DIM_START} to ${LAST_SPAN}, and everything before that is preparation.</p>`;

  const screen = `<ul>
    <li><b>Top bar.</b> The span and day, the countdown to the Dimming, and four gauges: food, energy, morale and people. Parts, free crews, the names on the Plate, Guide and Restart are at the top right. ${show('gauges', 'the gauges')}</li>
    <li><b>Map.</b> Every site the colony knows. Click one to select it. ${show('map', 'the map')}</li>
    <li><b>Site panel.</b> Under the map. It describes the selected site and lists the work orders you can give there. ${show('site', 'the site panel')}</li>
    <li><b>Story panel.</b> Reports, the matter to decide, outcomes, and the End span button. ${show('story', 'the story panel')}</li>
    <li><b>Council.</b> The seven people you govern with: how far each trusts you, what each wants, what each has asked of you and what each remembers. ${show('council', 'the Council tab')}</li>
    <li><b>Threads.</b> Promises and asks with their deadlines, consequences still on their way, and effects in force. ${show('threads', 'the Threads tab')}</li>
    <li><b>Colony.</b> Rations and shifts, what the colony makes and uses each span, and Patience’s projection. ${show('colony', 'the Colony tab')}</li>
    <li><b>Record.</b> Charts, the timeline and a journal of everything you decided. ${show('record', 'the Record tab')}</li>
  </ul>
  <p class="eyebrow">Marks on the map</p>
  <ul>
    <li>The ring around a site is its integrity. It turns amber under 55% and red when critical, with a red dot beside it.</li>
    <li>A pulsing ring marks the site the current matter concerns.</li>
    <li>A dashed circle marks the site you have selected.</li>
    <li>Small lettered discs are councillors. Click one to open that person’s card.</li>
    <li>The dotted line is the terminator. Night lies leeward of it, and it creeps sunward as the Dimming nears.</li>
    <li>New sites appear when the colony finds them.</li>
  </ul>
  <p class="g-note">On a narrow screen the panels stack: story first, then the map, the site panel and these tabs.</p>`;
